<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Семейный Чат</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e5ddd5; height: 100vh; display: flex; flex-direction: column; }
    #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #075e54; color: white; padding: 20px; }
    #auth-form { background: white; padding: 25px; border-radius: 12px; color: #333; width: 100%; max-width: 320px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
    #auth-form h2 { font-size: 20px; text-align: center; color: #075e54; }
    #auth-form input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; outline: none; }
    #auth-form button { padding: 12px; background: #25d366; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    #chat-screen { display: none; flex-direction: column; height: 100vh; position: relative; }
    header { background: #075e54; color: white; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    header h1 { font-size: 16px; }
    .header-btns { display: flex; gap: 8px; align-items: center; }
    .call-btn { background: #25d366; border: none; color: white; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    #logout-btn { background: transparent; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    #messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; position: relative; word-wrap: break-word; line-height: 1.4; }
    .msg.mine { align-self: flex-end; background: #dcf8c6; border-top-right-radius: 0; }
    .msg.other { align-self: flex-start; background: white; border-top-left-radius: 0; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .msg .author { font-size: 11px; font-weight: bold; color: #075e54; margin-bottom: 2px; }
    .msg .time { font-size: 10px; color: #888; text-align: right; margin-top: 4px; }
    .msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; display: block; }
    #input-area { background: #f0f0f0; padding: 10px; display: flex; gap: 8px; align-items: center; }
    #message-input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; outline: none; }
    #send-btn, #photo-btn { background: #075e54; color: white; border: none; padding: 10px 14px; border-radius: 50%; cursor: pointer; font-size: 16px; }
    #file-input { display: none; }

    /* Окно звонка */
    #call-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; align-items: center; justify-content: center; color: white; }
    #video-container { width: 100%; max-width: 480px; height: 60vh; position: relative; background: #222; border-radius: 12px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    #local-video { width: 100px; height: 150px; position: absolute; bottom: 10px; right: 10px; border: 2px solid white; border-radius: 8px; z-index: 2; background: #000; }
    .call-controls { margin-top: 20px; display: flex; gap: 15px; }
    .call-action-btn { padding: 12px 24px; border-radius: 25px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
    #accept-call-btn { background: #25d366; color: white; }
    #end-call-btn { background: #ff3b30; color: white; }
  </style>
</head>
<body>

  <div id="auth-screen">
    <form id="auth-form">
      <h2>Семейный Чат</h2>
      <input type="text" id="username-input" placeholder="Ваше имя" required>
      <button type="submit">Войти в чат</button>
    </form>
  </div>

  <div id="chat-screen">
    <header>
      <h1 id="user-display">Семейный Чат</h1>
      <div class="header-btns">
        <button class="call-btn" id="audio-call-btn">📞</button>
        <button class="call-btn" id="video-call-btn">📹</button>
        <button id="logout-btn">Выйти</button>
      </div>
    </header>
    <div id="messages"></div>
    <div id="input-area">
      <button id="photo-btn" type="button">📷</button>
      <input type="file" id="file-input" accept="image/*">
      <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
      <button id="send-btn" type="button">➤</button>
    </div>

    <!-- Элементы видео и аудио -->
    <audio id="remote-audio" autoplay></audio>
    <div id="call-overlay">
      <h3 id="call-status">Входящий вызов...</h3>
      <div id="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>
      <div class="call-controls">
        <button class="call-action-btn" id="accept-call-btn">Ответить</button>
        <button class="call-action-btn" id="end-call-btn">Завершить</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = localStorage.getItem('chat_username') || '';

    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const authForm = document.getElementById('auth-form');
    const usernameInput = document.getElementById('username-input');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const photoBtn = document.getElementById('photo-btn');
    const fileInput = document.getElementById('file-input');

    // Элементы звонка
    const callOverlay = document.getElementById('call-overlay');
    const callStatus = document.getElementById('call-status');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const remoteAudio = document.getElementById('remote-audio');

    let localStream;
    let peerConnection;
    let incomingOffer;
    let isVideoCall = false;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    if (currentUser) {
      showChat();
    }

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const username = usernameInput.value.trim();
      if (!username) return;

      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) {
          currentUser = data.username;
          localStorage.setItem('chat_username', currentUser);
          showChat();
        }
      });
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('chat_username');
      fetch('/api/logout', { method: 'POST' }).then(() => location.reload());
    });

    function showChat() {
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      document.getElementById('user-display').innerText = `Вы: ${currentUser}`;
      socket.emit('register user', currentUser);
    }

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;
      socket.emit('chat message', { type: 'text', text: text, user: currentUser });
      messageInput.value = '';
    }

    photoBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      resizeAndSendImage(file);
      fileInput.value = '';
    });

    function resizeAndSendImage(file) {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxDimension = 1280;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > maxDimension) { height *= maxDimension / width; width = maxDimension; }
          } else {
            if (height > maxDimension) { width *= maxDimension / height; height = maxDimension; }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
          socket.emit('chat message', { type: 'image', text: compressedDataUrl, user: currentUser });
        };
      };
    }

    // --- Логика Аудио/Видео Звонков ---
    document.getElementById('audio-call-btn').addEventListener('click', () => startCall(false));
    document.getElementById('video-call-btn').addEventListener('click', () => startCall(true));

    async function startCall(videoEnabled) {
      isVideoCall = videoEnabled;
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
        localVideo.srcObject = isVideoCall ? localStream : null;
        localVideo.style.display = isVideoCall ? 'block' : 'none';

        callOverlay.style.display = 'flex';
        acceptCallBtn.style.display = 'none';
        callStatus.innerText = 'Вызов...';

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          if (isVideoCall) {
            remoteVideo.srcObject = event.streams[0];
          } else {
            remoteAudio.srcObject = event.streams[0];
            remoteAudio.play().catch(e => console.log('Audio autoplay error:', e));
          }
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit('ice-candidate', { candidate: event.candidate });
          }
        };

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('call-user', { from: currentUser, offer, isVideo: isVideoCall });
      } catch (err) {
        alert('Ошибка доступа к микрофону/камере: ' + err.message);
      }
    }

    socket.on('incoming-call', async (data) => {
      if (data.from === currentUser) return;
      incomingOffer = data.offer;
      isVideoCall = data.isVideo;

      callOverlay.style.display = 'flex';
      acceptCallBtn.style.display = 'inline-block';
      callStatus.innerText = `Входящий ${isVideoCall ? 'видео' : 'аудио'} звонок от ${data.from}`;
    });

    acceptCallBtn.addEventListener('click', async () => {
      acceptCallBtn.style.display = 'none';
      callStatus.innerText = 'Соединение...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
        localVideo.srcObject = isVideoCall ? localStream : null;
        localVideo.style.display = isVideoCall ? 'block' : 'none';

        peerConnection = new RTCPeerConnection(rtcConfig);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = (event) => {
          if (isVideoCall) {
            remoteVideo.srcObject = event.streams[0];
            remoteVideo.play().catch(e => console.log('Video play error:', e));
          } else {
            remoteAudio.srcObject = event.streams[0];
            remoteAudio.play().catch(e => console.log('Audio play error:', e));
          }
        };

        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            socket.emit('ice-candidate', { candidate: event.candidate });
          }
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('answer-call', { answer });
      } catch (err) {
        alert('Ошибка принятия вызова: ' + err.message);
      }
    });

    socket.on('call-answered', async (data) => {
      callStatus.innerText = 'Разговор...';
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('ice-candidate', async (candidate) => {
      if (peerConnection && candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (e) {
          console.error('Ошибка ICE:', e);
        }
      }
    });

    endCallBtn.addEventListener('click', () => {
      socket.emit('end-call');
      closeCall();
    });

    socket.on('call-ended', closeCall);

    function closeCall() {
      callOverlay.style.display = 'none';
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      remoteAudio.srcObject = null;
      remoteVideo.srcObject = null;
    }

    // История и сообщения
    socket.on('chat history', (history) => {
      messagesDiv.innerHTML = '';
      history.forEach(appendMessage);
      scrollToBottom();
    });

    socket.on('chat message', (msg) => {
      appendMessage(msg);
      scrollToBottom();
    });

    function appendMessage(msg) {
      const isMine = msg.user === currentUser;
      const msgEl = document.createElement('div');
      msgEl.className = `msg ${isMine ? 'mine' : 'other'}`;

      const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let contentHtml = '';
      if (msg.type === 'image') {
        contentHtml = `<img src="${msg.text}" alt="Фото">`;
      } else {
        contentHtml = `<div>${escapeHtml(msg.text)}</div>`;
      }

      msgEl.innerHTML = `
        ${!isMine ? `<div class="author">${escapeHtml(msg.user)}</div>` : ''}
        ${contentHtml}
        <div class="time">${timeStr}</div>
      `;

      messagesDiv.appendChild(msgEl);
    }

    function scrollToBottom() {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
