<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный Чат</title>
  <!-- PeerJS CDN for WebRTC Video/Audio Calls & P2P Data Messaging -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
    }

    #app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    /* AUTH SCREEN */
    #auth-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 20px;
      text-align: center;
      z-index: 10;
    }

    .auth-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(to right, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
    }

    .avatar-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .avatar-option {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .avatar-option.selected {
      border-color: #a855f7;
      transform: scale(1.1);
      background: rgba(168, 85, 247, 0.25);
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #a855f7;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* CHAT MAIN SCREEN */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    #header {
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      flex-shrink: 0;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #chat-title {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      flex-direction: column;
    }

    #chat-subtitle {
      font-size: 11px;
      color: #22c55e;
      font-weight: normal;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* SIDEBAR DRAWER */
    #sidebar {
      position: absolute;
      top: 0;
      left: -100%;
      width: 300px;
      height: 100%;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 200;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-section {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.5);
      margin: 14px 0 8px 0;
    }

    .chat-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      transition: background 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .user-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* MESSAGES AREA */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .system-msg {
      align-self: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin: 6px 0;
      text-align: center;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      word-wrap: break-word;
      position: relative;
      line-height: 1.4;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }

    .message-user {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.85;
      margin-bottom: 2px;
      color: #ec4899;
    }

    .message.own .message-user {
      color: #e0e7ff;
    }

    .message-file img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 12px;
      display: block;
      margin-top: 6px;
    }

    .file-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.25);
      padding: 6px 10px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-size: 12px;
      margin-top: 6px;
    }

    .message-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 2px;
    }

    .message-actions {
      display: flex;
      gap: 4px;
      opacity: 0.7;
    }

    .message:hover .message-actions {
      opacity: 1;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      color: #fff;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .reactions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .reaction-badge {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 2px 6px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .reaction-badge.active {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.35);
    }

    .reaction-popover {
      position: absolute;
      bottom: 100%;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 4px 8px;
      display: flex;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 40;
    }

    .reaction-popover span {
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.15s;
    }

    .reaction-popover span:hover {
      transform: scale(1.3);
    }

    /* EMOJI PICKER */
    #emoji-picker {
      position: absolute;
      bottom: 70px;
      left: 16px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .emoji-item {
      font-size: 20px;
      cursor: pointer;
      text-align: center;
      padding: 4px;
      border-radius: 8px;
    }

    .emoji-item:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .create-room-btn {
      width: 100%;
      margin: 8px 0;
      padding: 9px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px dashed rgba(168, 85, 247, 0.5);
      border-radius: 12px;
      color: #e9d5ff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .message-time {
      font-size: 10px;
      opacity: 0.6;
      text-align: right;
      margin-top: 2px;
    }

    #typing-indicator {
      display: none;
      padding: 0 16px 6px 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-style: italic;
    }

    /* INPUT AREA */
    #input-area {
      padding: 10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    #message-input {
      flex: 1;
      border-radius: 20px;
      margin-bottom: 0;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 14px;
    }

    #file-input { display: none; }

    #file-btn {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }

    #send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    /* WEBRTC CALL OVERLAY */
    #call-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100dvh;
      background: rgba(15, 23, 42, 0.98);
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 20px 30px 20px;
    }

    #call-header { text-align: center; }

    #call-status {
      font-size: 20px;
      font-weight: 600;
      margin-top: 8px;
    }

    #call-user-name {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }

    #call-timer {
      font-size: 13px;
      color: #a855f7;
      margin-top: 4px;
    }

    #video-container {
      position: relative;
      flex: 1;
      margin: 16px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .audio-avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .audio-avatar-circle {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.6); }
      70% { box-shadow: 0 0 0 25px rgba(168, 85, 247, 0); }
      100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #local-video {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 100px;
      height: 140px;
      object-fit: cover;
      border-radius: 14px;
      border: 2px solid rgba(255, 255, 255, 0.4);
    }

    .call-controls {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .call-action-btn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .call-action-btn.off {
      background: rgba(239, 68, 68, 0.8) !important;
    }

    #accept-call-btn { background: #22c55e; display: none; }
    #end-call-btn { background: #ef4444; }
    #toggle-mic-btn, #toggle-cam-btn { background: rgba(255, 255, 255, 0.15); }

    /* TOAST NOTIFICATION */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 1000;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div id="app">
    <div id="toast"></div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
      <div class="glass-card">
        <h2 class="auth-title">Семейный Чат</h2>
        <p class="auth-subtitle">Выберите аватар и введите имя</p>

        <div class="avatar-picker" id="avatar-picker">
          <div class="avatar-option selected" data-avatar="👨‍👩‍👧‍👦">👨‍👩‍👧‍👦</div>
          <div class="avatar-option" data-avatar="👨">👨</div>
          <div class="avatar-option" data-avatar="👩">👩</div>
          <div class="avatar-option" data-avatar="👧">👧</div>
          <div class="avatar-option" data-avatar="👦">👦</div>
        </div>

        <form id="auth-form" onsubmit="return false;">
          <input type="text" id="family-id-input" placeholder="Код семьи (напр. family-123)..." value="family-123" required autocomplete="off">
          <input type="text" id="username-input" placeholder="Ваше имя (напр. Мама)..." required autocomplete="off">
          <button type="button" id="login-submit-btn" class="btn">Войти в семейный чат</button>
        </form>
      </div>
    </div>

    <!-- MAIN CHAT SCREEN -->
    <div id="chat-screen">
      <div id="header">
        <div class="header-info">
          <button class="icon-btn" id="menu-btn">💬</button>
          <div id="chat-title">
            <span id="current-chat-name">Общий чат</span>
            <span id="chat-subtitle">Общение со всей семьей</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="audio-call-btn" title="Аудиозвонок">📞</button>
          <button class="icon-btn" id="video-call-btn" title="Видеозвонок">📹</button>
        </div>
      </div>

      <!-- SIDEBAR DRAWER -->
      <div id="sidebar">
        <div class="sidebar-header">
          <h3>Семейные чаты</h3>
          <button class="icon-btn" id="close-sidebar-btn">✖</button>
        </div>

        <button class="create-room-btn" id="create-room-btn">➕ Создать комната</button>

        <div class="sidebar-section">Каналы:</div>
        <div id="rooms-list">
          <div class="chat-item active" data-room="general">
            <div class="user-item-info">
              <span>💬</span>
              <span>Общий чат</span>
            </div>
          </div>
        </div>

        <div class="sidebar-section">Участники онлайн:</div>
        <div id="users-list"></div>

        <button class="btn" id="logout-btn" style="margin-top: auto; background: rgba(239, 68, 68, 0.2); color: #fca5a5;">Выйти</button>
      </div>

      <!-- MESSAGES AREA -->
      <div id="messages"></div>
      <div id="typing-indicator"></div>

      <!-- EMOJI PICKER POPOVER -->
      <div id="emoji-picker" style="display: none;">
        <span class="emoji-item">😀</span>
        <span class="emoji-item">😂</span>
        <span class="emoji-item">😍</span>
        <span class="emoji-item">😎</span>
        <span class="emoji-item">👍</span>
        <span class="emoji-item">❤️</span>
        <span class="emoji-item">🎉</span>
        <span class="emoji-item">🔥</span>
        <span class="emoji-item">🙌</span>
        <span class="emoji-item">🥳</span>
        <span class="emoji-item">🙏</span>
        <span class="emoji-item">💡</span>
        <span class="emoji-item">🏡</span>
        <span class="emoji-item">🛒</span>
        <span class="emoji-item">🍕</span>
        <span class="emoji-item">⭐</span>
        <span class="emoji-item">😮</span>
        <span class="emoji-item">😢</span>
      </div>

      <!-- INPUT AREA -->
      <div id="input-area">
        <button class="icon-btn" id="emoji-btn" type="button" title="Вставить эмодзи">😊</button>
        <label for="file-input" id="file-btn" title="Прикрепить файл">📎</label>
        <input type="file" id="file-input">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button class="btn" id="send-btn" type="button">➔</button>
      </div>
    </div>

    <!-- WEBRTC CALL OVERLAY -->
    <div id="call-overlay">
      <div id="call-header">
        <div id="call-status">Звонок...</div>
        <div id="call-user-name">Соединение...</div>
        <div id="call-timer">00:00</div>
      </div>

      <div id="video-container">
        <div id="audio-avatar" class="audio-avatar-container" style="display: none;">
          <div class="audio-avatar-circle" id="call-avatar-icon">👤</div>
        </div>
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>

      <div class="call-controls">
        <button class="call-action-btn" id="toggle-mic-btn" title="Микрофон">🎙️</button>
        <button class="call-action-btn" id="accept-call-btn" title="Ответить">📞</button>
        <button class="call-action-btn" id="toggle-cam-btn" title="Камера">📷</button>
        <button class="call-action-btn" id="end-call-btn" title="Завершить">✖</button>
      </div>
    </div>
  </div>

  <script>
    // State variables
    let currentUser = localStorage.getItem('chat_username') || '';
    let familyCode = localStorage.getItem('chat_family_code') || 'family-123';
    let selectedAvatar = localStorage.getItem('chat_avatar') || '👨‍👩‍👧‍👦';
    
    let currentRoom = 'general';
    let selectedTargetUser = null; // null = room chat, otherwise username
    let myPeer = null;
    let peerConnections = {}; // peerId -> DataConnection
    let activeCall = null; // PeerJS MediaConnection
    let localMediaStream = null;

    // BroadcastChannel for instant local browser-tab communication

    const audioCallBtn = document.getElementById('audio-call-btn');
    const videoCallBtn = document.getElementById('video-call-btn');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const toggleMicBtn = document.getElementById('toggle-mic-btn');
    const toggleCamBtn = document.getElementById('toggle-cam-btn');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // Web Audio API Ringtone Generator
    function startRingtone() {
      try {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (ringtoneOscillator) return;

        ringtoneOscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        ringtoneOscillator.type = 'sine';
        ringtoneOscillator.frequency.setValueAtTime(440, audioContext.currentTime); // A4
        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        
        ringtoneOscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        ringtoneOscillator.start();
      } catch(e){}
    }

    function stopRingtone() {
      if (ringtoneOscillator) {
        try { ringtoneOscillator.stop(); } catch(e){}
        ringtoneOscillator = null;
      }
    }

    // Avatar selector
    avatarOptions.forEach(option => {
      option.addEventListener('click', () => {
        avatarOptions.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        selectedAvatar = option.dataset.avatar;
      });
    });

    // Helper: sanitize Peer ID from name and family code
    function getPeerId(name, famCode) {
      const cleanFam = famCode.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
      const cleanUser = encodeURIComponent(name).replace(/%/g, '_');
      return `fam_${cleanFam}_${cleanUser}`;
    }

    // Login Handler
    function handleLogin() {
      const name = usernameInput.value.trim();
      const fam = familyIdInput.value.trim();
      if (!name || !fam) {
        showToast('Введите ваше имя и код семьи');
        return;
      }

      currentUser = name;
      familyCode = fam;
      localStorage.setItem('chat_username', currentUser);
      localStorage.setItem('chat_family_code', familyCode);
      localStorage.setItem('chat_avatar', selectedAvatar);

      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';

      initPeerJS();
      renderRooms();
      renderMessages();
    }

    loginSubmitBtn.addEventListener('click', handleLogin);
    authForm.addEventListener('submit', (e) => { e.preventDefault(); handleLogin(); });

    if (currentUser) {
      usernameInput.value = currentUser;
      familyIdInput.value = familyCode;
      avatarOptions.forEach(opt => {
        if (opt.dataset.avatar === selectedAvatar) opt.classList.add('selected');
        else opt.classList.remove('selected');
      });
      handleLogin();
    }

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('chat_username');
      location.reload();
    });

    // Initialize PeerJS P2P Networking
    function initPeerJS() {
      const myPeerId = getPeerId(currentUser, familyCode);

      myPeer = new Peer(myPeerId, {
        debug: 1,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      });

      myPeer.on('open', (id) => {
        console.log('PeerJS Connected with ID:', id);
        broadcastPresence();
        setInterval(broadcastPresence, 4000); // Heartbeat
      });

      myPeer.on('connection', (conn) => {
        setupDataConnection(conn);
      });

      myPeer.on('call', (call) => {
        handleIncomingMediaCall(call);
      });

      myPeer.on('error', (err) => {
        console.warn('PeerJS Error:', err.type);
      });

      // Listen to local tab broadcast channel
      broadcastChan.onmessage = (event) => {
        handleIncomingData(event.data);
      };
    }

    // Broadcast presence & discover family members
    function broadcastPresence() {
      const payload = {
        type: 'presence',
        user: currentUser,
        avatar: selectedAvatar,
        peerId: getPeerId(currentUser, familyCode),
        timestamp: Date.now()
      };

      // Broadcast to local tabs
      broadcastChan.postMessage(payload);

      // Send to known connected peers
      Object.values(peerConnections).forEach(conn => {
        if (conn.open) conn.send(payload);
      });

      // Try connecting to common family member peer slots if offline
      ['Мама', 'Папа', 'Дочка', 'Сын', 'Бабушка', 'Дедушка'].forEach(famName => {
        if (famName !== currentUser) {
          const targetPeerId = getPeerId(famName, familyCode);
          if (!peerConnections[targetPeerId]) {
            connectToPeer(targetPeerId);
          }
        }
      });

      cleanOfflineUsers();
    }

    function connectToPeer(targetPeerId) {
      if (!myPeer || myPeer.destroyed || peerConnections[targetPeerId]) return;
      
      try {
        const conn = myPeer.connect(targetPeerId, { reliable: true });
        setupDataConnection(conn);
      } catch(e){}
    }

    function setupDataConnection(conn) {
      peerConnections[conn.peer] = conn;

      conn.on('open', () => {
        conn.send({
          type: 'presence',
          user: currentUser,
          avatar: selectedAvatar,
          peerId: myPeer.id,
          timestamp: Date.now()
        });
      });

      conn.on('data', (data) => {
        handleIncomingData(data);
      });

      conn.on('close', () => {
        delete peerConnections[conn.peer];
      });
    }

    // Handle all incoming data messages
    function handleIncomingData(data) {
      if (!data || !data.type) return;

      if (data.type === 'presence') {
        if (data.user && data.user !== currentUser) {
          onlineUsers[data.user] = {
            name: data.user,
            avatar: data.avatar || '👤',
            peerId: data.peerId,
            lastSeen: Date.now()
          };
          renderUsersList();
        }
      } else if (data.type === 'message') {
        const msg = data.message;
        if (!messagesHistory.some(m => m.id === msg.id)) {
          messagesHistory.push(msg);
          saveMessagesHistory();
          
          if (shouldShowMsg(msg)) {
            appendMessageUI(msg);
          }
        }
      } else if (data.type === 'delete-message') {
        messagesHistory = messagesHistory.filter(m => m.id !== data.messageId);
        saveMessagesHistory();
        const msgEl = document.getElementById(`msg-${data.messageId}`);
        if (msgEl) msgEl.remove();
      } else if (data.type === 'reaction') {
        const msg = messagesHistory.find(m => m.id === data.messageId);
        if (msg) {
          if (!msg.reactions) msg.reactions = {};
          msg.reactions[data.user] = data.emoji;
          saveMessagesHistory();
          const msgEl = document.getElementById(`msg-${data.messageId}`);
          if (msgEl) updateReactionsUI(msgEl, msg.reactions, msg.id);
        }
      } else if (data.type === 'typing') {
        if (data.user !== currentUser) {
          typingIndicator.innerText = `${data.user} печатает...`;
          typingIndicator.style.display = 'block';
          clearTimeout(window.typingTimeout);
          window.typingTimeout = setTimeout(() => { typingIndicator.style.display = 'none'; }, 2000);
        }
      } else if (data.type === 'end-call') {
        endCall(false);
      }
    }

    function cleanOfflineUsers() {
      const now = Date.now();
      let updated = false;
      Object.keys(onlineUsers).forEach(u => {
        if (now - onlineUsers[u].lastSeen > 12000) {
          delete onlineUsers[u];
          updated = true;
        }
      });
      if (updated) renderUsersList();
    }

    function renderUsersList() {
      usersListContainer.innerHTML = '';
      const users = Object.values(onlineUsers);
      
      if (users.length === 0) {
        usersListContainer.innerHTML = `<div style="font-size: 12px; color: rgba(255,255,255,0.4); padding: 6px;">Пока нет других участников</div>`;
        return;
      }

      users.forEach(u => {
        const item = document.createElement('div');
        item.className = `chat-item ${selectedTargetUser === u.name ? 'active' : ''}`;
        item.innerHTML = `
          <div class="user-item-info">
            <span>${u.avatar}</span>
            <span>${escapeHtml(u.name)}</span>
          </div>
          <div class="status-dot"></div>
        `;
        item.addEventListener('click', () => {
          selectUserChat(u.name, u.avatar);
        });
        usersListContainer.appendChild(item);
      });
    }

    // Sidebar & UI Controls
    menuBtn.addEventListener('click', () => { sidebar.classList.add('open'); });
    closeSidebarBtn.addEventListener('click', () => { sidebar.classList.remove('open'); });

    function selectUserChat(username, avatar) {
      selectedTargetUser = username;
      currentRoom = null;
      currentChatName.innerText = `${avatar || '👤'} ${username}`;
      chatSubtitle.innerText = 'Личные сообщения';

      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));

    function selectRoom(roomId, roomName) {

      selectedTargetUser = null;
      currentChatName.innerText = roomName;
      chatSubtitle.innerText = 'Семейный канал';
      
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));

    createRoomBtn.addEventListener('click', () => {
      const roomName = prompt('Введите название новой комнаты:');
      if (roomName && roomName.trim()) {
        const newRoom = { id: 'room_' + Date.now(), name: roomName.trim(), icon: '🏠' };
        roomsList.push(newRoom);
        renderRooms();
        selectRoom(newRoom.id, newRoom.name);
      }
    });

    function renderRooms() {
      roomsListContainer.innerHTML = '';
      roomsList.forEach(room => {
        const item = document.createElement('div');
        item.className = `chat-item ${currentRoom === room.id && !selectedTargetUser ? 'active' : ''}`;

          <div class="user-item-info">

    // Send Message Logic
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    messageInput.addEventListener('input', () => {
      broadcastData({ type: 'typing', user: currentUser });
    });

    async function sendMessage() {
      const text = messageInput.value.trim();
      const file = fileInput.files[0];

      if (!text && !file) return;

      let fileData = null;
      if (file) {
        fileData = {
          name: file.name,
          type: file.type,
          data: await readFileAsBase64(file)
        };
      }

      const newMsg = {
        id: Date.now().toString() + '_' + Math.random().toString(36).substring(2, 6),
        user: currentUser,
        avatar: selectedAvatar,
        text: text,
        file: fileData,
        targetUser: selectedTargetUser,
        room: currentRoom,
        reactions: {},
        timestamp: Date.now()
      };

      messagesHistory.push(newMsg);
      saveMessagesHistory();

      appendMessageUI(newMsg);
      broadcastData({ type: 'message', message: newMsg });

      messageInput.value = '';
      fileInput.value = '';
      emojiPicker.style.display = 'none';
    }

    function broadcastData(payload) {
      broadcastChan.postMessage(payload);
      Object.values(peerConnections).forEach(conn => {
        if (conn.open) conn.send(payload);
      });
    }

    function saveMessagesHistory() {
      try {
        localStorage.setItem(`chat_msgs_${familyCode}`, JSON.stringify(messagesHistory.slice(-200)));
      } catch(e){}
    }

    function shouldShowMsg(msg) {
      if (selectedTargetUser) {
        return (msg.user === currentUser && msg.targetUser === selectedTargetUser) ||
               (msg.user === selectedTargetUser && msg.targetUser === currentUser);
      } else {
        return msg.room === currentRoom && !msg.targetUser;
      }
    }

    function renderMessages() {
      messagesDiv.innerHTML = '';
      const filtered = messagesHistory.filter(m => shouldShowMsg(m));
      filtered.forEach(msg => appendMessageUI(msg));
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function appendMessageUI(msg) {
      if (!shouldShowMsg(msg)) return;

      const isOwn = msg.user === currentUser;
      const msgEl = document.createElement('div');
      msgEl.className = `message ${isOwn ? 'own' : 'other'}`;
      msgEl.id = `msg-${msg.id}`;

      const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let fileHTML = '';
      if (msg.file) {
        if (msg.file.type && msg.file.type.startsWith('image/')) {
          fileHTML = `<div class="message-file"><img src="${msg.file.data}" alt="attachment"></div>`;
        } else {
          fileHTML = `<div class="message-file"><a class="file-download-btn" href="${msg.file.data}" download="${escapeHtml(msg.file.name)}">💾 ${escapeHtml(msg.file.name)}</a></div>`;
        }
      }

      const actionsHTML = `
        <div class="message-actions">
          <button class="action-btn react-btn" title="Реакция">❤️</button>
          ${isOwn ? `<button class="action-btn delete-btn" title="Удалить">🗑️</button>` : ''}
        </div>
      `;

      msgEl.innerHTML = `
        <div class="message-header-row">
          <div class="message-user">${escapeHtml(msg.user)}</div>
          ${actionsHTML}
        </div>
        <div>${escapeHtml(msg.text)}</div>
        ${fileHTML}
        <div class="reactions-bar"></div>
        <div class="message-time">${time}</div>
      `;

      const reactBtn = msgEl.querySelector('.react-btn');
      reactBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showReactionPopover(msgEl, msg.id);
      });

      if (isOwn) {
        const deleteBtn = msgEl.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => {
          messagesHistory = messagesHistory.filter(m => m.id !== msg.id);
          saveMessagesHistory();
          msgEl.remove();
          broadcastData({ type: 'delete-message', messageId: msg.id });
        });
      }

      updateReactionsUI(msgEl, msg.reactions || {}, msg.id);

      messagesDiv.appendChild(msgEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showReactionPopover(msgEl, messageId) {
      let popover = msgEl.querySelector('.reaction-popover');
      if (popover) { popover.remove(); return; }

      popover = document.createElement('div');
      popover.className = 'reaction-popover';
      ['👍', '❤️', '😂', '😮', '😢', '🎉'].forEach(emoji => {
        const span = document.createElement('span');
        span.innerText = emoji;
        span.addEventListener('click', () => {
          const msg = messagesHistory.find(m => m.id === messageId);
          if (msg) {
            if (!msg.reactions) msg.reactions = {};
            msg.reactions[currentUser] = emoji;
            saveMessagesHistory();
            updateReactionsUI(msgEl, msg.reactions, messageId);
            broadcastData({ type: 'reaction', messageId, emoji, user: currentUser });
          }
          popover.remove();
        });
        popover.appendChild(span);
      });

      msgEl.appendChild(popover);
    }

    function updateReactionsUI(msgEl, reactions, messageId) {
      const reactionsBar = msgEl.querySelector('.reactions-bar');
      if (!reactionsBar) return;
      reactionsBar.innerHTML = '';

      const counts = {};
      Object.entries(reactions).forEach(([user, emoji]) => {
        if (!counts[emoji]) counts[emoji] = { count: 0, users: [] };
        counts[emoji].count++;
        counts[emoji].users.push(user);
      });

      Object.entries(counts).forEach(([emoji, data]) => {
        const badge = document.createElement('div');
        const hasReacted = data.users.includes(currentUser);
        badge.className = `reaction-badge ${hasReacted ? 'active' : ''}`;
        badge.innerHTML = `<span>${emoji}</span> <span>${data.count}</span>`;
        badge.title = data.users.join(', ');
        reactionsBar.appendChild(badge);
      });
    }

    // Emoji Picker Events
    emojiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      emojiPicker.style.display = emojiPicker.style.display === 'none' ? 'grid' : 'none';
    });

    document.addEventListener('click', (e) => {
      if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
        emojiPicker.style.display = 'none';
      }
    });

    document.querySelectorAll('.emoji-item').forEach(item => {
      item.addEventListener('click', () => {
        messageInput.value += item.innerText;
        messageInput.focus();
      });
    });

    // Helper functions
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    // WEBRTC CALLING SYSTEM
    audioCallBtn.addEventListener('click', () => startCall('audio'));
    videoCallBtn.addEventListener('click', () => startCall('video'));

    async function startCall(type) {
      if (!selectedTargetUser) {
        showToast('Выберите конкретного участника онлайн для звонка');
        return;
      }

      const targetInfo = onlineUsers[selectedTargetUser];
      if (!targetInfo || !targetInfo.peerId) {
        showToast(`${selectedTargetUser} не в сети для WebRTC вызова`);
        return;
      }

      callStatus.innerText = type === 'audio' ? 'Исходящий аудиозвонок...' : 'Исходящий видеозвонок...';
      callUserName.innerText = `${targetInfo.avatar || '👤'} ${selectedTargetUser}`;
      callOverlay.style.display = 'flex';
      acceptCallBtn.style.display = 'none';

      setupCallUI(type);
      startRingtone();

      try {
        localMediaStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: type === 'video'
        });

        if (type === 'video') localVideo.srcObject = localMediaStream;

        activeCall = myPeer.call(targetInfo.peerId, localMediaStream, {
          metadata: { type, callerName: currentUser, callerAvatar: selectedAvatar }
        });

        handleCallStream(activeCall, type);

      } catch (err) {
        console.error('Call media error:', err);
        stopRingtone();
        showToast('Ошибка доступа к микрофону/камере');
        endCall(true);
      }
    }

    function handleIncomingMediaCall(call) {
      activeCall = call;
      const metadata = call.metadata || {};
      const callType = metadata.type || 'video';
      const callerName = metadata.callerName || 'Участник семьи';
      const callerAvatar = metadata.callerAvatar || '👤';

      startRingtone();

      callStatus.innerText = callType === 'audio' ? 'Входящий аудиозвонок' : 'Входящий видеозвонок';
      callUserName.innerText = `${callerAvatar} ${callerName}`;
      callOverlay.style.display = 'flex';
      acceptCallBtn.style.display = 'flex';

      setupCallUI(callType);

      acceptCallBtn.onclick = async () => {
        acceptCallBtn.style.display = 'none';
        stopRingtone();
        callStatus.innerText = 'Соединение...';

        try {
          localMediaStream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: callType === 'video'
          });

          if (callType === 'video') localVideo.srcObject = localMediaStream;

          call.answer(localMediaStream);
          handleCallStream(call, callType);

        } catch (err) {
          console.error('Accept call media error:', err);
          showToast('Не удалось открыть микрофон/камеру');
          endCall(true);
        }
      };
    }

    function handleCallStream(call, type) {
      call.on('stream', (remoteStream) => {
        stopRingtone();
        callStatus.innerText = 'Разговор';
        startCallTimer();

        if (type === 'video') {
          remoteVideo.srcObject = remoteStream;
        } else {
          // Play remote audio
          const remoteAudio = new Audio();
          remoteAudio.srcObject = remoteStream;
          remoteAudio.play();
        }
      });

      call.on('close', () => endCall(false));
      call.on('error', () => endCall(false));
    }

    function setupCallUI(type) {
      if (type === 'audio') {
        remoteVideo.style.display = 'none';
        localVideo.style.display = 'none';
        audioAvatar.style.display = 'flex';
        toggleCamBtn.style.display = 'none';
        callAvatarIcon.innerText = selectedAvatar || '👤';
      } else {
        remoteVideo.style.display = 'block';
        localVideo.style.display = 'block';
        audioAvatar.style.display = 'none';
        toggleCamBtn.style.display = 'flex';
      }
    }

    toggleMicBtn.addEventListener('click', () => {
      if (localMediaStream) {
        const track = localMediaStream.getAudioTracks()[0];
        if (track) {
          isAudioMuted = !isAudioMuted;
          track.enabled = !isAudioMuted;
          toggleMicBtn.classList.toggle('off', isAudioMuted);
          toggleMicBtn.innerText = isAudioMuted ? '🔇' : '🎙️';
        }
      }
    });

    toggleCamBtn.addEventListener('click', () => {
      if (localMediaStream) {
        const track = localMediaStream.getVideoTracks()[0];
        if (track) {
          isVideoMuted = !isVideoMuted;
          track.enabled = !isVideoMuted;
          toggleCamBtn.classList.toggle('off', isVideoMuted);
          toggleCamBtn.innerText = isVideoMuted ? '🚫' : '📷';
        }
      }
    });

    endCallBtn.addEventListener('click', () => endCall(true));

    function endCall(notify = true) {
      stopRingtone();
      if (notify) broadcastData({ type: 'end-call' });

      if (activeCall) {
        try { activeCall.close(); } catch(e){}
        activeCall = null;
      }

      if (localMediaStream) {
        localMediaStream.getTracks().forEach(track => track.stop());
        localMediaStream = null;
      }

      remoteVideo.srcObject = null;
      localVideo.srcObject = null;
      callOverlay.style.display = 'none';
      stopCallTimer();

      isAudioMuted = false;
      isVideoMuted = false;
      toggleMicBtn.classList.remove('off');
      toggleCamBtn.classList.remove('off');
      toggleMicBtn.innerText = '🎙️';
      toggleCamBtn.innerText = '📷';
    }

    function startCallTimer() {
      callSeconds = 0;
      callTimer.innerText = '00:00';
      clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        callTimer.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function stopCallTimer() {
      clearInterval(callTimerInterval);
      callTimer.innerText = '00:00';
    }
  </script>
</body>
</html>
