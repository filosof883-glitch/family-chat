<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный Чат</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 500px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    #auth-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 24px;
      text-align: center;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    h2 {
      font-size: 24px;
      margin-bottom: 24px;
      font-weight: 600;
      background: linear-gradient(to right, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    #header {
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    #user-display {
      font-weight: 600;
      font-size: 15px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
    }

    .logout-btn {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
    }

    /* Окно списка пользователей */
    #users-modal {
      display: none;
      position: absolute;
      top: 60px;
      right: 16px;
      width: 220px;
      background: rgba(30, 27, 75, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .users-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .user-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .status-dot.online {
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .status-dot.offline {
      background-color: #64748b;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease-in-out;
      position: relative;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .message-user {
      font-size: 11px;
      opacity: 0.7;
    }

    .delete-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer;
      font-size: 13px;
      padding: 0 0 0 10px;
      margin-top: -2px;
      margin-right: -4px;
    }

    .delete-btn:hover { color: #fca5a5; }

    .message-time {
      font-size: 10px;
      opacity: 0.6;
      text-align: right;
      margin-top: 4px;
    }

    .message-img {
      width: 100%;
      max-width: 260px;
      border-radius: 12px;
      margin-top: 4px;
      display: block;
    }

    #input-area {
      flex-shrink: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    #message-input {
      flex: 1;
      border-radius: 20px;
      margin-bottom: 0;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
    }

    #send-btn, #photo-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    #file-input { display: none; }

    #call-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      height: 100dvh;
      background: rgba(15, 23, 42, 0.98);
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 20px calc(30px + env(safe-area-inset-bottom)) 20px;
    }

    #call-status {
      text-align: center;
      font-size: 20px;
      margin-top: 20px;
    }

    #video-container {
      position: relative;
      flex: 1;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 20px;
    }

    #local-video {
      position: absolute;
      top: 10px; right: 10px;
      width: 100px; height: 140px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .call-controls {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-bottom: 20px;
    }

    .call-action-btn {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    #accept-call-btn { background: #22c55e; }
    #end-call-btn { background: #ef4444; }
  </style>
</head>
<body>

  <div id="app">
    <div id="auth-screen">
      <div class="glass-card">
        <h2>Семейный Чат</h2>
        <form id="auth-form">
          <input type="text" id="username-input" placeholder="Введите ваше имя..." required autocomplete="off">
          <button type="submit" class="btn">Войти в чат</button>
        </form>
      </div>
    </div>

    <div id="chat-screen">
      <div id="header">
        <div id="user-display">Вы: ...</div>
        <div class="header-actions">
          <button class="icon-btn" id="users-toggle-btn" title="Участники">👥</button>
          <button class="icon-btn" id="audio-call-btn" title="Аудиовызов">📞</button>
          <button class="icon-btn" id="video-call-btn" title="Видеовызов">📹</button>
          <button class="logout-btn" id="logout-btn">Выйти</button>
        </div>
      </div>

      <!-- Выпадающее окно со списком участников -->
      <div id="users-modal">
        <div class="users-title">Участники чата</div>
        <div id="users-list-container"></div>
      </div>

      <div id="messages"></div>

      <div id="input-area">
        <button class="icon-btn" id="photo-btn" type="button">📷</button>
        <input type="file" id="file-input" accept="image/*">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button class="btn" id="send-btn" type="button">➔</button>
      </div>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>
    <div id="call-overlay">
      <h3 id="call-status">Входящий вызов...</h3>
      <div id="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>
      <div class="call-controls">
        <button class="call-action-btn" id="accept-call-btn">📞</button>
        <button class="call-action-btn" id="end-call-btn">✖</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = localStorage.getItem('chat_username') || '';

    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const authForm = document.getElementById('auth-form');
    const usernameInput = document.getElementById('username-input');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const photoBtn = document.getElementById('photo-btn');
    const fileInput = document.getElementById('file-input');

    const usersToggleBtn = document.getElementById('users-toggle-btn');
    const usersModal = document.getElementById('users-modal');
    const usersListContainer = document.getElementById('users-list-container');

    const callOverlay = document.getElementById('call-overlay');
    const callStatus = document.getElementById('call-status');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const remoteAudio = document.getElementById('remote-audio');

    let localStream;
    let peerConnection;
    let incomingOffer;
    let isVideoCall = false;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.relay.metered.ca:80' },
        {
          urls: 'turn:global.relay.metered.ca:80',
          username: 'ba2a3b043d9b4b0a316c0250',
          credential: 'S7dd3vT/3jITh445'
        },
        {
          urls: 'turn:global.relay.metered.ca:443',
          username: 'ba2a3b043d9b4b0a316c0250',
          credential: 'S7dd3vT/3jITh445'
        },
        {
          urls: 'turn:global.relay.metered.ca:443?transport=tcp',
          username: 'ba2a3b043d9b4b0a316c0250',
          credential: 'S7dd3vT/3jITh445'
        }
      ]
    };

    if (currentUser) {
      showChat();
    }

    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = usernameInput.value.trim();
      if (val) {
        currentUser = val;
        localStorage.setItem('chat_username', currentUser);
        showChat();
      }
    });

    function showChat() {
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      document.getElementById('user-display').innerText = `Вы: ${currentUser}`;
      socket.emit('register user', currentUser);

      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    }

    // Открытие/закрытие списка участников
    usersToggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      usersModal.style.display = usersModal.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', () => {
      usersModal.style.display = 'none';
    });

    // Обработка получения списка участников
    socket.on('users list', (users) => {
      usersListContainer.innerHTML = '';
      users.forEach(u => {
        const row = document.createElement('div');
        row.className = 'user-row';
        row.innerHTML = `
          <span>${escapeHtml(u.username)} ${u.username === currentUser ? '(Вы)' : ''}</span>
          <span class="status-dot ${u.online ? 'online' : 'offline'}" title="${u.online ? 'В сети' : 'Не в сети'}"></span>
        `;
        usersListContainer.appendChild(row);
      });
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('chat_username');
      location.reload();
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text) {
        socket.emit('chat message', {
          user: currentUser,
          text: text,
          type: 'text'
        });
        messageInput.value = '';
      }
    }

    window.deleteMessage = function(id) {
      if (confirm('Удалить это сообщение?')) {
        socket.emit('delete message', id);
      }
    };

    socket.on('delete message', (id) => {
      const msgElement = document.querySelector(`.message[data-id="${id}"]`);
      if (msgElement) {
        msgElement.remove();
      }
    });

    photoBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxSize = 800;

        if (width > height && width > maxSize) {
          height *= maxSize / width;
          width = maxSize;
        } else if (height > maxSize) {
          width *= maxSize / height;
          height = maxSize;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const base64Image = canvas.toDataURL('image/jpeg', 0.6);

        socket.emit('chat message', {
          user: currentUser,
          image: base64Image,
          type: 'image'
        });

        fileInput.value = '';
        URL.revokeObjectURL(img.src);
      };
    });

    socket.on('chat history', (history) => {
      messagesDiv.innerHTML = '';
      history.forEach((msg) => appendMessage(msg));
      scrollToBottom();
    });

    socket.on('chat message', (msg) => {
      appendMessage(msg);
      scrollToBottom();

      if (msg.user !== currentUser && document.hidden) {
        if ("Notification" in window && Notification.permission === "granted") {
          const notification = new Notification(`Сообщение от ${msg.user}`, {
            body: msg.type === 'image' ? '📷 Фотография' : msg.text
          });
          notification.onclick = () => {
            window.focus();
            notification.close();
          };
        }
      }
    });

    function appendMessage(msg) {
      const isOwn = msg.user === currentUser;
      const msgEl = document.createElement('div');
      msgEl.classList.add('message', isOwn ? 'own' : 'other');

      if (msg.id) {
        msgEl.setAttribute('data-id', msg.id);
      }

      const dateObj = msg.timestamp ? new Date(msg.timestamp) : new Date();
      const time = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const deleteButtonHtml = (isOwn && msg.id) 
        ? `<button class="delete-btn" onclick="deleteMessage('${msg.id}')">🗑️</button>` 
        : '';

      let content = `
        <div class="message-header">
          <span class="message-user">${msg.user}</span>
          ${deleteButtonHtml}
        </div>
      `;

      if (msg.type === 'image') {
        content += `<img src="${msg.image}" class="message-img" onload="scrollToBottom()" />`;
      } else {
        content += `<div>${escapeHtml(msg.text)}</div>`;
      }
      content += `<div class="message-time">${time}</div>`;

      msgEl.innerHTML = content;
      messagesDiv.appendChild(msgEl);
    }

    function scrollToBottom() {
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById('audio-call-btn').addEventListener('click', () => startCall(false));
    document.getElementById('video-call-btn').addEventListener('click', () => startCall(true));

    async function startCall(video) {
      isVideoCall = video;
      callOverlay.style.display = 'flex';
      callStatus.innerText = 'Звоним...';
      acceptCallBtn.style.display = 'none';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
        if (video) localVideo.srcObject = localStream;

        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('call-user', { offer, isVideo: video, from: currentUser });
      } catch (err) {
        console.error('Ошибка доступа к медиаустройствам:', err);
        endCall();
      }
    }

    socket.on('incoming-call', async (data) => {
      incomingOffer = data.offer;
      isVideoCall = data.isVideo;
      callOverlay.style.display = 'flex';
      callStatus.innerText = `Входящий ${isVideoCall ? 'видео' : 'аудио'} вызов от ${data.from}`;
      acceptCallBtn.style.display = 'flex';
    });

    acceptCallBtn.addEventListener('click', async () => {
      acceptCallBtn.style.display = 'none';
      callStatus.innerText = 'Соединение...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
        if (isVideoCall) localVideo.srcObject = localStream;

        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('make-answer', { answer });
      } catch (err) {
        console.error('Ошибка при приеме звонка:', err);
        endCall();
      }
    });

    socket.on('call-answered', async (data) => {
      callStatus.innerText = 'Разговор...';
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error('Ошибка добавления ICE candidate', e);
        }
      }
    });

    socket.on('call-ended', () => {
      endCall(false);
    });

    endCallBtn.addEventListener('click', () => {
      socket.emit('end-call');
      endCall(true);
    });

    function createPeerConnection() {
      const pc = new RTCPeerConnection(rtcConfig);

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit('ice-candidate', { candidate: event.candidate });
        }
      };

      pc.ontrack = (event) => {
        if (isVideoCall) {
          remoteVideo.srcObject = event.streams[0];
        } else {
          remoteAudio.srcObject = event.streams[0];
        }
      };

      return pc;
    }

    function endCall(emit = true) {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      callOverlay.style.display = 'none';
      localVideo.srcObject = null;
      remoteVideo.srcObject = null;
      remoteAudio.srcObject = null;
    }
  </script>
</body>
</html>
