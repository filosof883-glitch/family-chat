<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный Чат</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
    }

    #app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    }

    /* GLASS CARD COMMON */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    /* AUTH SCREEN */
    #auth-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    .auth-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
    }

    .avatar-picker {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .avatar-option {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .avatar-option.selected {
      border-color: #a855f7;
      transform: scale(1.1);
      background: rgba(168, 85, 247, 0.2);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #a855f7;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* CHAT MAIN SCREEN */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    /* HEADER */
    #header {
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      flex-shrink: 0;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    #chat-title {
      font-weight: 600;
      font-size: 16px;
      display: flex;
      flex-direction: column;
    }

    #chat-subtitle {
      font-size: 11px;
      color: #22c55e;
      font-weight: normal;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* SIDEBAR DRAWER */
    #sidebar {
      position: absolute;
      top: 0;
      left: -100%;
      width: 300px;
      height: 100%;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 200;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-section {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.5);
      margin: 16px 0 8px 0;
    }

    .chat-item {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      transition: background 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .user-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* MESSAGES AREA */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .system-msg {
      align-self: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin: 8px 0;
      text-align: center;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      word-wrap: break-word;
      position: relative;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }

    .message-user {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 4px;
      color: #ec4899;
    }

    .message.own .message-user {
      color: #e0e7ff;
    }

    .message-file {
      margin-top: 8px;
    }

    .message-file img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      display: block;
      margin-top: 4px;
    }

    .file-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      margin-top: 4px;
    }

    .message-time {
      font-size: 10px;
      opacity: 0.6;
      text-align: right;
      margin-top: 4px;
    }

    #typing-indicator {
      display: none;
      padding: 0 20px 8px 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-style: italic;
    }

    /* INPUT AREA */
    #input-area {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    #message-input {
      flex: 1;
      border-radius: 24px;
      margin-bottom: 0;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 15px;
    }

    #file-input {
      display: none;
    }

    #file-btn {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      flex-shrink: 0;
    }

    #send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    /* WEBRTC CALL OVERLAY */
    #call-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100dvh;
      background: rgba(15, 23, 42, 0.98);
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 20px 30px 20px;
    }

    #call-header {
      text-align: center;
    }

    #call-status {
      font-size: 22px;
      font-weight: 600;
      margin-top: 10px;
    }

    #call-user-name {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }

    #video-container {
      position: relative;
      flex: 1;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #local-video {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 110px;
      height: 150px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .call-controls {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 20px;
    }

    .call-action-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .call-action-btn:active {
      transform: scale(0.9);
    }

    #accept-call-btn { background: #22c55e; }
    #end-call-btn { background: #ef4444; }
    #toggle-mic-btn, #toggle-cam-btn { background: rgba(255, 255, 255, 0.15); }
  </style>
</head>
<body>

  <div id="app">
    <!-- AUTH SCREEN -->
    <div id="auth-screen">
      <div class="glass-card">
        <h2 class="auth-title">Семейный Чат</h2>
        <p class="auth-subtitle">Выберите аватар и введите имя</p>

        <div class="avatar-picker" id="avatar-picker">
          <div class="avatar-option selected" data-avatar="👨‍👩‍👧‍👦">👨‍👩‍👧‍👦</div>
          <div class="avatar-option" data-avatar="👨">👨</div>
          <div class="avatar-option" data-avatar="👩">👩</div>
          <div class="avatar-option" data-avatar="👧">👧</div>
          <div class="avatar-option" data-avatar="👦">👦</div>
        </div>

        <form id="auth-form" onsubmit="return false;">
          <input type="text" id="username-input" placeholder="Ваше имя..." required autocomplete="off">
          <button type="button" id="login-submit-btn" class="btn">Войти в семейный чат</button>
        </form>
      </div>
    </div>

    <!-- MAIN CHAT SCREEN -->
    <div id="chat-screen">
      <div id="header">
        <div class="header-info">
          <button class="icon-btn" id="menu-btn">💬</button>
          <div id="chat-title">
            <span id="current-chat-name">Общий чат</span>
            <span id="chat-subtitle">Общение со всей семьей</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="audio-call-btn" title="Аудиозвонок">📞</button>
          <button class="icon-btn" id="video-call-btn" title="Видеозвонок">📹</button>
        </div>
      </div>

      <!-- SIDEBAR DRAWER -->
      <div id="sidebar">
        <div class="sidebar-header">
          <h3>Семейные чаты</h3>
          <button class="icon-btn" id="close-sidebar-btn">✖</button>
        </div>

        <div class="chat-item active" id="general-chat-btn">
          <div class="user-item-info">
            <span>💬</span>
            <span>Общий чат</span>
          </div>
        </div>

        <div class="sidebar-section">В сети:</div>
        <div id="users-list"></div>

        <button class="btn" id="logout-btn" style="margin-top: auto; background: rgba(239, 68, 68, 0.2); color: #fca5a5;">Сменить имя</button>
      </div>

      <!-- MESSAGES AREA -->
      <div id="messages"></div>
      <div id="typing-indicator"></div>

      <!-- INPUT AREA -->
      <div id="input-area">
        <label for="file-input" id="file-btn" title="Прикрепить файл">📎</label>
        <input type="file" id="file-input">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button class="btn" id="send-btn" type="button">➔</button>
      </div>
    </div>

    <!-- WEBRTC CALL OVERLAY -->
    <audio id="remote-audio" autoplay playsinline></audio>
    <div id="call-overlay">
      <div id="call-header">
        <div id="call-status">Звонок...</div>
        <div id="call-user-name">Соединение со связью</div>
      </div>

      <div id="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>

      <div class="call-controls">
        <button class="call-action-btn" id="toggle-mic-btn" title="Микрофон">🎙️</button>
        <button class="call-action-btn" id="accept-call-btn" title="Ответить">📞</button>
        <button class="call-action-btn" id="toggle-cam-btn" title="Камера">📷</button>
        <button class="call-action-btn" id="end-call-btn" title="Завершить">✖</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    
    let currentUser = localStorage.getItem('chat_username') || '';
    let selectedAvatar = localStorage.getItem('chat_avatar') || '👨‍👩‍👧‍👦';
    let selectedTargetUser = null; // null = Общий чат

    // DOM Elements
    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const loginSubmitBtn = document.getElementById('login-submit-btn');
    const avatarOptions = document.querySelectorAll('.avatar-option');
    
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const fileInput = document.getElementById('file-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');

    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menu-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const usersListContainer = document.getElementById('users-list');
    const currentChatName = document.getElementById('current-chat-name');
    const chatSubtitle = document.getElementById('chat-subtitle');
    const generalChatBtn = document.getElementById('general-chat-btn');
    const logoutBtn = document.getElementById('logout-btn');

    // Avatar selector logic
    avatarOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        avatarOptions.forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
        selectedAvatar = opt.dataset.avatar;
      });
    });

    // Sidebar drawer toggles
    menuBtn.addEventListener('click', () => sidebar.classList.add('open'));
    closeSidebarBtn.addEventListener('click', () => sidebar.classList.remove('open'));

    // Authentication Logic
    function performLogin() {
      const val = usernameInput.value.trim();
      if (val) {
        currentUser = val;
        localStorage.setItem('chat_username', currentUser);
        localStorage.setItem('chat_avatar', selectedAvatar);
        showChat();
      }
    }

    loginSubmitBtn.addEventListener('click', performLogin);
    usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performLogin(); });

    if (currentUser) {
      showChat();
    }

    function showChat() {
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      socket.emit('register-user', { username: currentUser, avatar: selectedAvatar });
    }

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('chat_username');
      location.reload();
    });

    generalChatBtn.addEventListener('click', () => {
      selectedTargetUser = null;
      currentChatName.innerText = "Общий чат";
      chatSubtitle.innerText = "Общение со всей семьей";
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      generalChatBtn.classList.add('active');
      sidebar.classList.remove('open');
      messagesDiv.innerHTML = '';
      socket.emit('get-history', { room: 'general' });
    });

    // User Online List Update
    socket.on('users-list', (users) => {
      usersListContainer.innerHTML = '';
      users.forEach(u => {
        if (u.username === currentUser) return;

        const item = document.createElement('div');
        item.className = 'chat-item';
        if (selectedTargetUser === u.username) item.classList.add('active');

        item.innerHTML = `
          <div class="user-item-info">
            <span>${u.avatar || '👤'}</span>
            <span>${escapeHtml(u.username)}</span>
          </div>
          <span class="status-dot"></span>
        `;

        item.addEventListener('click', () => {
          selectedTargetUser = u.username;
          currentChatName.innerText = u.username;
          chatSubtitle.innerText = 'Личные сообщения';
          sidebar.classList.remove('open');

          document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');

          messagesDiv.innerHTML = '';
          socket.emit('get-history', { targetUser: u.username });
        });

        usersListContainer.appendChild(item);
      });
    });

    // Send Messages & Files
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    let typingTimeout;
    messageInput.addEventListener('input', () => {
      socket.emit('typing', { targetUser: selectedTargetUser, room: 'general', isTyping: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('typing', { targetUser: selectedTargetUser, room: 'general', isTyping: false });
      }, 1500);
    });

    socket.on('typing', (data) => {
      if (data.isTyping) {
        typingIndicator.innerText = `${data.from} печатает...`;
        typingIndicator.style.display = 'block';
      } else {
        typingIndicator.style.display = 'none';
      }
    });

    async function sendMessage() {
      const text = messageInput.value.trim();
      const file = fileInput.files[0];

      if (!text && !file) return;

      let fileData = null;
      if (file) {
        fileData = {
          name: file.name,
          type: file.type,
          size: file.size,
          data: await readFileAsBase64(file)
        };
      }

      socket.emit('chat message', {
        user: currentUser,
        text: text,
        file: fileData,
        targetUser: selectedTargetUser,
        room: 'general'
      });

      messageInput.value = '';
      fileInput.value = '';
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    socket.on('chat message', (msg) => {
      if (!selectedTargetUser) appendMessage(msg);
    });

    socket.on('private message', (msg) => {
      if (selectedTargetUser && (msg.user === selectedTargetUser || msg.targetUser === selectedTargetUser)) {
        appendMessage(msg);
      }
    });

    socket.on('history-data', (data) => {
      messagesDiv.innerHTML = '';
      if (data.messages) {
        data.messages.forEach(msg => appendMessage(msg));
      }
    });

    function appendMessage(msg) {
      if (msg.isSystem) {
        const sysEl = document.createElement('div');
        sysEl.className = 'system-msg';
        sysEl.innerText = msg.text;
        messagesDiv.appendChild(sysEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return;
      }

      const isOwn = msg.user === currentUser;
      const msgEl = document.createElement('div');
      msgEl.className = `message ${isOwn ? 'own' : 'other'}`;

      const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let fileHTML = '';
      if (msg.file) {
        if (msg.file.type.startsWith('image/')) {
          fileHTML = `<div class="message-file"><img src="${msg.file.data}" alt="attachment"></div>`;
        } else {
          fileHTML = `<div class="message-file"><a class="file-download-btn" href="${msg.file.data}" download="${msg.file.name}">💾 ${escapeHtml(msg.file.name)}</a></div>`;
        }
      }

      msgEl.innerHTML = `
        <div class="message-user">${escapeHtml(msg.user)}</div>
        <div>${escapeHtml(msg.text)}</div>
        ${fileHTML}
        <div class="message-time">${time}</div>
      `;

      messagesDiv.appendChild(msgEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function escapeHtml(t) {
      return t ? t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    /* WEBRTC LOGIC FOR AUDIO & VIDEO CALLS */
    const callOverlay = document.getElementById('call-overlay');
    const callStatus = document.getElementById('call-status');
    const callUserName = document.getElementById('call-user-name');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const toggleMicBtn = document.getElementById('toggle-mic-btn');
    const toggleCamBtn = document.getElementById('toggle-cam-btn');

    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const remoteAudio = document.getElementById('remote-audio');

    let localStream, peerConnection, incomingOffer, isVideoCall = false;
    let activeCallTargetSocketId = null;
    let micEnabled = true, camEnabled = true;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    document.getElementById('audio-call-btn').addEventListener('click', () => initiateCall(false));
    document.getElementById('video-call-btn').addEventListener('click', () => initiateCall(true));

    async function initiateCall(video) {
      if (!selectedTargetUser) {
        alert('Выберите собеседника из списка слева (💬), чтобы совершить вызов!');
        return;
      }

      isVideoCall = video;
      callOverlay.style.display = 'flex';
      callStatus.innerText = video ? 'Видеовызов...' : 'Аудиовызов...';
      callUserName.innerText = selectedTargetUser;
      acceptCallBtn.style.display = 'none';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
        localVideo.style.display = video ? 'block' : 'none';
        localVideo.srcObject = localStream;

        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('call-user', { targetUser: selectedTargetUser, offer, isVideo: video });
      } catch (err) {
        alert('Не удалось получить доступ к микрофону/камере');
        endCall();
      }
    }

    socket.on('incoming-call', (data) => {
      incomingOffer = data.offer;
      isVideoCall = data.isVideo;
      activeCallTargetSocketId = data.fromSocketId;

      callOverlay.style.display = 'flex';
      callStatus.innerText = 'Входящий вызов';
      callUserName.innerText = data.from;
      acceptCallBtn.style.display = 'flex';
    });

    acceptCallBtn.addEventListener('click', async () => {
      acceptCallBtn.style.display = 'none';
      callStatus.innerText = 'Соединение...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
        localVideo.style.display = isVideoCall ? 'block' : 'none';
        localVideo.srcObject = localStream;

        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('make-answer', { targetSocketId: activeCallTargetSocketId, answer });
      } catch (err) {
        endCall();
      }
    });

    socket.on('call-answered', async (data) => {
      activeCallTargetSocketId = data.fromSocketId;
      callStatus.innerText = 'Идет разговор';
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {}
      }
    });

    socket.on('call-ended', () => endCall());
    endCallBtn.addEventListener('click', () => {
      if (activeCallTargetSocketId) socket.emit('end-call', { targetSocketId: activeCallTargetSocketId });
      endCall();
    });

    toggleMicBtn.addEventListener('click', () => {
      if (localStream) {
        micEnabled = !micEnabled;
        localStream.getAudioTracks().forEach(t => t.enabled = micEnabled);
        toggleMicBtn.style.opacity = micEnabled ? '1' : '0.4';
      }
    });

    toggleCamBtn.addEventListener('click', () => {
      if (localStream && isVideoCall) {
        camEnabled = !camEnabled;
        localStream.getVideoTracks().forEach(t => t.enabled = camEnabled);
        toggleCamBtn.style.opacity = camEnabled ? '1' : '0.4';
      }
    });

    function createPeerConnection() {
      const pc = new RTCPeerConnection(rtcConfig);
      pc.onicecandidate = (e) => {
        if (e.candidate && activeCallTargetSocketId) {
          socket.emit('ice-candidate', { targetSocketId: activeCallTargetSocketId, candidate: e.candidate });
        }
      };
      pc.ontrack = (e) => {
        if (isVideoCall) {
          remoteVideo.srcObject = e.streams[0];
        } else {
          remoteAudio.srcObject = e.streams[0];
        }
      };
      return pc;
    }

    function endCall() {
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
      }
      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }
      callOverlay.style.display = 'none';
      activeCallTargetSocketId = null;
    }
  </script>
</body>
</html>
