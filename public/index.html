<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Семейный Чат — Liquid Glass</title>
  
  <!-- PeerJS CDN for WebRTC Video/Audio Calls & Realtime P2P Data Messaging -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script>
    if (typeof Peer === 'undefined') {
      document.write('<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');
    }
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #080a12;
      color: #f1f5f9;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Animated Ambient Background Blobs for Refraction */
    .ambient-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .liquid-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.6;
      animation: floatBlob 18s infinite alternate ease-in-out;
    }

    .blob-1 {
      width: 340px;
      height: 340px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.85) 0%, rgba(99, 102, 241, 0.4) 100%);
      top: -10%;
      left: -10%;
    }

    .blob-2 {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.75) 0%, rgba(139, 92, 246, 0.35) 100%);
      bottom: -15%;
      right: -10%;
      animation-delay: -6s;
    }

    .blob-3 {
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.65) 0%, rgba(59, 130, 246, 0.35) 100%);
      top: 40%;
      left: 30%;
      animation-delay: -12s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      50% { transform: translate(60px, -40px) scale(1.15) rotate(180deg); }
      100% { transform: translate(-40px, 50px) scale(0.95) rotate(360deg); }
    }

    /* App Container Glass Wrapper */
    #app {
      width: 100%;
      max-width: 520px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
      background: rgba(18, 22, 38, 0.45);
      backdrop-filter: blur(40px) saturate(210%);
      -webkit-backdrop-filter: blur(40px) saturate(210%);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
    }

    @media (min-width: 540px) {
      #app {
        height: 94vh;
        max-height: 900px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        overflow: hidden;
      }
    }

    /* Auth Screen Glass Card */
    #auth-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    .liquid-glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.04) 100%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(25px) saturate(180%);
      -webkit-backdrop-filter: blur(25px) saturate(180%);
      border-radius: 32px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      position: relative;
      overflow: hidden;
    }

    .auth-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #d8b4fe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 12px rgba(168, 85, 247, 0.3);
    }

    .auth-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 24px;
      font-weight: 400;
    }

    .avatar-picker {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .avatar-option {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .avatar-option:hover {
      transform: translateY(-2px) scale(1.05);
      background: rgba(255, 255, 255, 0.15);
    }

    .avatar-option.selected {
      border-color: #c084fc;
      transform: scale(1.15);
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.4) 0%, rgba(99, 102, 241, 0.4) 100%);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.25);
      color: #fff;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
      transition: all 0.25s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: text;
    }

    input[type="text"]::placeholder {
      color: rgba(255, 255, 255, 0.45);
    }

    input[type="text"]:focus {
      border-color: rgba(192, 132, 252, 0.8);
      background: rgba(0, 0, 0, 0.35);
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.85) 0%, rgba(99, 102, 241, 0.85) 100%);
      color: white;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 8px 25px rgba(168, 85, 247, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(168, 85, 247, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .btn:active {
      transform: scale(0.97);
    }

    /* Main Chat Layout */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      position: relative;
    }

    #header {
      padding: 14px 18px;
      margin: 12px 12px 0 12px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      flex-shrink: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #chat-title {
      font-weight: 600;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      letter-spacing: -0.2px;
    }

    #chat-subtitle {
      font-size: 11px;
      color: #4ade80;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-indicator-dot {
      width: 7px;
      height: 7px;
      background: #4ade80;
      border-radius: 50%;
      box-shadow: 0 0 8px #4ade80;
      display: inline-block;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.08);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    /* Sidebar Drawer with Backdrop */
    #sidebar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 190;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    #sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    #sidebar {
      position: absolute;
      top: 0;
      left: -100%;
      width: 82%;
      max-width: 320px;
      height: 100%;
      background: rgba(15, 18, 32, 0.92);
      backdrop-filter: blur(40px) saturate(220%);
      -webkit-backdrop-filter: blur(40px) saturate(220%);
      border-right: 1px solid rgba(255, 255, 255, 0.2);
      z-index: 200;
      transition: left 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      box-shadow: 20px 0 50px rgba(0, 0, 0, 0.5);
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .sidebar-header h3 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .sidebar-section {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.5);
      margin: 16px 0 10px 4px;
      font-weight: 600;
    }

    .chat-item {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      transition: all 0.25s ease;
    }

    .chat-item:hover, .chat-item.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.3) 0%, rgba(99, 102, 241, 0.3) 100%);
      border: 1px solid rgba(168, 85, 247, 0.5);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    .user-item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    /* Message Bubbles Styling */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .empty-chat-placeholder {
      margin: auto;
      text-align: center;
      padding: 32px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      max-width: 320px;
      color: rgba(255, 255, 255, 0.7);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .empty-chat-icon {
      font-size: 48px;
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 8px 16px rgba(168, 85, 247, 0.4));
    }

    .empty-chat-title {
      font-weight: 700;
      font-size: 16px;
      color: #fff;
      margin-bottom: 6px;
    }

    .empty-chat-desc {
      font-size: 13px;
      line-height: 1.45;
      color: rgba(255, 255, 255, 0.65);
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 22px;
      font-size: 14px;
      word-wrap: break-word;
      position: relative;
      line-height: 1.45;
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      user-select: text;
    }

    .message.active-popover {
      z-index: 200 !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(147, 51, 234, 0.85) 0%, rgba(79, 70, 229, 0.85) 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #ffffff;
      border-bottom-right-radius: 6px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      box-shadow: 0 8px 25px rgba(126, 34, 206, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
    }

    .message.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #f8fafc;
      border-bottom-left-radius: 6px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .message-user {
      font-size: 11px;
      font-weight: 700;
      opacity: 0.9;
      margin-bottom: 3px;
      color: #f472b6;
      letter-spacing: -0.1px;
    }

    .message.own .message-user {
      color: #e0e7ff;
    }

    .message-file img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 16px;
      display: block;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .file-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 12px;
      color: white;
      text-decoration: none;
      font-size: 12px;
      margin-top: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: background 0.2s;
    }

    .file-download-btn:hover {
      background: rgba(0, 0, 0, 0.5);
    }

    .message-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 2px;
    }

    .message-actions {
      display: flex;
      gap: 4px;
      opacity: 0.8;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      padding: 3px 7px;
      font-size: 12px;
      cursor: pointer;
      color: #fff;
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: scale(1.1);
    }

    /* Reactions and Emoji Pickers */
    .reactions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .reaction-badge {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      backdrop-filter: blur(10px);
    }

    .reaction-badge.active {
      border-color: #c084fc;
      background: rgba(168, 85, 247, 0.4);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .reaction-popover {
      position: absolute;
      background: rgba(24, 28, 50, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(30px) saturate(210%);
      -webkit-backdrop-filter: blur(30px) saturate(210%);
      border-radius: 24px;
      padding: 8px 14px;
      display: flex;
      gap: 10px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), 0 0 20px rgba(168, 85, 247, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      z-index: 300;
      white-space: nowrap;
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .message.own .reaction-popover { right: 0; }
    .message.other .reaction-popover { left: 0; }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    .reaction-popover.popover-top { bottom: calc(100% + 10px); }
    .reaction-popover.popover-bottom { top: calc(100% + 10px); }

    .reaction-popover span {
      cursor: pointer;
      font-size: 20px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .reaction-popover span:hover { transform: scale(1.4); }

    #emoji-picker {
      position: absolute;
      bottom: 80px;
      left: 18px;
      background: rgba(20, 24, 42, 0.92);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255, 255, 255, 0.3);
      z-index: 100;
    }

    .emoji-item {
      font-size: 22px;
      cursor: pointer;
      text-align: center;
      padding: 6px;
      border-radius: 12px;
      transition: transform 0.2s;
    }

    .emoji-item:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: scale(1.2);
    }

    .create-room-btn {
      width: 100%;
      margin: 10px 0;
      padding: 11px;
      background: rgba(168, 85, 247, 0.18);
      border: 1px dashed rgba(168, 85, 247, 0.5);
      border-radius: 16px;
      color: #e9d5ff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .create-room-btn:hover { background: rgba(168, 85, 247, 0.3); }

    .message-time {
      font-size: 10px;
      opacity: 0.65;
      text-align: right;
      margin-top: 3px;
    }

    #typing-indicator {
      display: none;
      padding: 0 20px 8px 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      font-style: italic;
    }

    #input-area {
      padding: 10px 14px calc(12px + env(safe-area-inset-bottom)) 14px;
      margin: 0 12px 12px 12px;
      border-radius: 28px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(30px) saturate(200%);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      flex-shrink: 0;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    #message-input {
      flex: 1;
      border-radius: 20px;
      margin-bottom: 0;
      padding: 10px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 14px;
    }

    #file-input { display: none; }

    #file-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
      transition: all 0.2s ease;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    #file-btn:hover { background: rgba(255, 255, 255, 0.2); }

    #send-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 16px;
    }

    /* Video and Audio Calling Overlay */
    #call-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100dvh;
      background: rgba(10, 12, 22, 0.88);
      backdrop-filter: blur(40px) saturate(220%);
      -webkit-backdrop-filter: blur(40px) saturate(220%);
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px;
    }

    #call-header { text-align: center; }

    #call-status {
      font-size: 22px;
      font-weight: 700;

    // Call UI elements
    const callOverlay = $('call-overlay');

    // Profile Modal Elements
    const profileModal = $('profile-modal');
    const openMyProfileBtn = $('open-my-profile-btn');
    const closeProfileModal = $('close-profile-modal');

    const profilePhotoPreview = $('profile-photo-preview');

    // State Variables
    let currentUser = localStorage.getItem('chat_username') || '';
    let familyCode = localStorage.getItem('chat_family_code') || 'family-123';
    let selectedAvatar = localStorage.getItem('chat_avatar') || '👨‍👩‍👧‍👦';
    let userPhoto = localStorage.getItem('chat_user_photo') || '';
    let userRole = localStorage.getItem('chat_user_role') || 'Родственник';
    let userDob = localStorage.getItem('chat_user_dob') || '';
    let userBio = localStorage.getItem('chat_user_bio') || '';

    let currentRoom = 'general';
    let selectedTargetUser = null; 
    let myPeer = null;
    let peerConnections = {}; 
    let activeCall = null; 
    let localMediaStream = null;
    let isAudioMuted = false;
    let isVideoMuted = false;
    let callTimerInterval = null;
    let callSeconds = 0;

    let onlineUsers = {}; 
    let roomsList = JSON.parse(localStorage.getItem('chat_rooms_list')) || [{ id: 'general', name: 'Общий чат', icon: '💬' }];
    let messagesHistory = JSON.parse(localStorage.getItem(`chat_msgs_${familyCode}`)) || []; 

    // Cross-tab synchronization
    const broadcastChan = new BroadcastChannel('family_chat_channel');

    let ringtoneAudioContext = null;
    let ringtoneInterval = null;

    function startRingtone() {
      try {
        stopRingtone();
        ringtoneAudioContext = new (window.AudioContext || window.webkitAudioContext)();
        const playTone = () => {
          if (!ringtoneAudioContext) return;
          const osc = ringtoneAudioContext.createOscillator();
          const gain = ringtoneAudioContext.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, ringtoneAudioContext.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ringtoneAudioContext.currentTime + 0.4);
          gain.gain.setValueAtTime(0.15, ringtoneAudioContext.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ringtoneAudioContext.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(ringtoneAudioContext.destination);
          osc.start();
          osc.stop(ringtoneAudioContext.currentTime + 0.4);
        };
        playTone();
        ringtoneInterval = setInterval(playTone, 1500);
      } catch (e) {}
    }

    function stopRingtone() {
      if (ringtoneInterval) clearInterval(ringtoneInterval);
      if (ringtoneAudioContext) {
        try { ringtoneAudioContext.close(); } catch(e){}
        ringtoneAudioContext = null;
      }
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    avatarOptions.forEach(option => {
      option.addEventListener('click', () => {
        avatarOptions.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        selectedAvatar = option.dataset.avatar;
      });
    });

    function getPeerId(name, famCode) {
      const cleanFam = famCode.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
      const cleanUser = encodeURIComponent(name).replace(/%/g, '_');
      return `fam_${cleanFam}_${cleanUser}`;
    }

    function handleLogin(e) {
      if (e) e.preventDefault();
      const name = usernameInput.value.trim();
      const fam = familyIdInput.value.trim();
      if (!name || !fam) {
        showToast('Введите ваше имя и код семьи');
        return;
      }

      currentUser = name;
      familyCode = fam;
      localStorage.setItem('chat_username', currentUser);
      localStorage.setItem('chat_family_code', familyCode);
      localStorage.setItem('chat_avatar', selectedAvatar);

      messagesHistory = JSON.parse(localStorage.getItem(`chat_msgs_${familyCode}`)) || [];

      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';

      initPeerJS();
      renderRooms();
      renderMessages();
    }

    authForm.addEventListener('submit', handleLogin);

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('chat_username');
      location.reload();
    });

    function initPeerJS() {
      const myPeerId = getPeerId(currentUser, familyCode);

      broadcastChan.onmessage = (event) => {
        handleIncomingData(event.data);
      };

      if (typeof Peer === 'undefined') {
        if (chatStatusText) {
          chatStatusText.innerText = 'Локальный режим (BroadcastChannel)';
          chatStatusText.style.color = '#f59e0b';
