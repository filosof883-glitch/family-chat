<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный Чат</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    html, body { height: 100%; height: 100dvh; width: 100%; overflow: hidden; background: #0f172a; color: #f8fafc; }
    body { display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); }
    #app { width: 100%; max-width: 500px; height: 100%; height: 100dvh; display: flex; flex-direction: column; position: relative; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    #auth-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; padding: 24px; text-align: center; }
    .glass-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 32px 24px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    h2 { font-size: 24px; margin-bottom: 24px; font-weight: 600; background: linear-gradient(to right, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    input[type="text"] { width: 100%; padding: 14px 18px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 16px; outline: none; margin-bottom: 16px; }
    .btn { width: 100%; padding: 14px; border-radius: 16px; border: none; background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); color: white; font-size: 16px; font-weight: 600; cursor: pointer; }
    #chat-screen { display: none; flex-direction: column; height: 100%; height: 100dvh; position: relative; }
    #header { padding: 12px 16px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid rgba(255, 255, 255, 0.1); display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-shrink: 0; }
    #chat-title { font-weight: 600; font-size: 16px; display: flex; flex-direction: column; }
    #chat-subtitle { font-size: 11px; opacity: 0.6; font-weight: normal; }
    .header-actions { display: flex; gap: 6px; align-items: center; }
    .icon-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50%; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: white; cursor: pointer; }
    #sidebar { position: absolute; top: 0; left: -100%; width: 280px; height: 100%; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-right: 1px solid rgba(255, 255, 255, 0.15); z-index: 200; transition: left 0.3s ease; display: flex; flex-direction: column; padding: 16px; }
    #sidebar.open { left: 0; }
    .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
    .sidebar-section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255, 255, 255, 0.5); margin: 12px 0 6px 0; }
    .chat-item { padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); margin-bottom: 6px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; font-size: 14px; }
    .chat-item:hover, .chat-item.active { background: rgba(168, 85, 247, 0.25); border: 1px solid rgba(168, 85, 247, 0.4); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    #messages { flex: 1; overflow-y: auto; padding: 20px 16px 30px 16px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 18px; font-size: 15px; word-wrap: break-word; }
    .message.own { align-self: flex-end; background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); color: white; border-bottom-right-radius: 4px; }
    .message.other { align-self: flex-start; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; border-bottom-left-radius: 4px; }
    .message-user { font-size: 11px; opacity: 0.7; margin-bottom: 2px; }
    .message-time { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 4px; }
    #typing-indicator { display: none; align-self: flex-start; font-size: 12px; color: rgba(255, 255, 255, 0.6); font-style: italic; padding: 4px 16px; }
    #input-area { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px; display: flex; gap: 8px; align-items: center; background: rgba(15, 23, 42, 0.95); border-top: 1px solid rgba(255, 255, 255, 0.15); }
    #message-input { flex: 1; border-radius: 20px; margin-bottom: 0; padding: 12px 16px; background: rgba(255, 255, 255, 0.08); }
    #send-btn { width: 44px; height: 44px; border-radius: 50%; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #call-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100dvh; background: rgba(15, 23, 42, 0.98); z-index: 999; display: none; flex-direction: column; justify-content: space-between; padding: 40px 20px 30px 20px; }
    #call-status { text-align: center; font-size: 20px; margin-top: 20px; }
    #video-container { position: relative; flex: 1; margin: 20px 0; display: flex; justify-content: center; align-items: center; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
    #local-video { position: absolute; top: 10px; right: 10px; width: 100px; height: 140px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.3); }
    .call-controls { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
    .call-action-btn { width: 64px; height: 64px; border-radius: 50%; border: none; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #accept-call-btn { background: #22c55e; }
    #end-call-btn { background: #ef4444; }
  </style>
</head>
<body>

  <div id="app">
    <div id="auth-screen">
      <div class="glass-card">
        <h2>Семейный Чат</h2>
        <form id="auth-form" onsubmit="return false;">
          <input type="text" id="username-input" placeholder="Введите ваше имя..." required autocomplete="off">
          <button type="button" id="login-submit-btn" class="btn">Войти в чат</button>
        </form>
      </div>
    </div>

    <div id="chat-screen">
      <div id="header">
        <button class="icon-btn" id="menu-btn">💬</button>
        <div id="chat-title">
          <span id="current-chat-name">Общий чат</span>
          <span id="chat-subtitle">Чат для всех</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="audio-call-btn">📞</button>
          <button class="icon-btn" id="video-call-btn">📹</button>
        </div>
      </div>

      <div id="sidebar">
        <div class="sidebar-header">
          <h3>Чаты</h3>
          <button class="icon-btn" id="close-sidebar-btn">✖</button>
        </div>
        <div class="chat-item active" id="general-chat-btn">
          <span>💬 Общий чат</span>
        </div>
        <div class="sidebar-section">Пользователи онлайн</div>
        <div id="users-list"></div>
        <button class="btn" id="logout-btn" style="margin-top: auto; background: rgba(239, 68, 68, 0.2); color: #fca5a5;">Выйти</button>
      </div>

      <div id="messages"></div>
      <div id="typing-indicator"></div>

      <div id="input-area">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button class="btn" id="send-btn" type="button">➔</button>
      </div>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>
    <div id="call-overlay">
      <h3 id="call-status">Звонок...</h3>
      <div id="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>
      <div class="call-controls">
        <button class="call-action-btn" id="accept-call-btn">📞</button>
        <button class="call-action-btn" id="end-call-btn">✖</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = localStorage.getItem('chat_username') || '';
    let selectedTargetUser = null;

    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const loginSubmitBtn = document.getElementById('login-submit-btn');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menu-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const usersListContainer = document.getElementById('users-list');
    const currentChatName = document.getElementById('current-chat-name');
    const chatSubtitle = document.getElementById('chat-subtitle');

    menuBtn.addEventListener('click', () => sidebar.classList.add('open'));
    closeSidebarBtn.addEventListener('click', () => sidebar.classList.remove('open'));

    function performLogin() {
      const val = usernameInput.value.trim();
      if (val) {
        currentUser = val;
        localStorage.setItem('chat_username', currentUser);
        showChat();
      }
    }

    loginSubmitBtn.addEventListener('click', performLogin);
    usernameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') performLogin(); });

    if (currentUser) {
      showChat();
    }

    function showChat() {
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      socket.emit('register-user', currentUser);
    }

    // Согласованный эвент от сервера!
    socket.on('users-list', (users) => {
      usersListContainer.innerHTML = '';
      users.forEach(u => {
        if (u.username === currentUser) return;

        const item = document.createElement('div');
        item.className = 'chat-item';
        if (selectedTargetUser === u.username) item.classList.add('active');
        
        item.innerHTML = `
          <span>👤 ${escapeHtml(u.username)}</span>
          <span class="status-dot"></span>
        `;
        
        item.addEventListener('click', () => {
          selectedTargetUser = u.username;
          currentChatName.innerText = u.username;
          chatSubtitle.innerText = 'В сети';
          sidebar.classList.remove('open');
          
          document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
          item.classList.add('active');
        });
        
        usersListContainer.appendChild(item);
      });
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text) {
        socket.emit('chat message', {
          user: currentUser,
          text: text
        });
        messageInput.value = '';
      }
    }

    socket.on('chat message', (msg) => {
      appendMessage(msg);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    });

    function appendMessage(msg) {
      const isOwn = msg.user === currentUser;
      const msgEl = document.createElement('div');
      msgEl.className = `message ${isOwn ? 'own' : 'other'}`;
      
      const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      msgEl.innerHTML = `
        <div class="message-user">${escapeHtml(msg.user)}</div>
        <div>${escapeHtml(msg.text)}</div>
        <div class="message-time">${time}</div>
      `;
      messagesDiv.appendChild(msgEl);
    }

    function escapeHtml(t) { return t ? t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : ''; }

    // --- WEBRTC ЗВОНКИ ---
    const callOverlay = document.getElementById('call-overlay');
    const callStatus = document.getElementById('call-status');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const remoteAudio = document.getElementById('remote-audio');

    let localStream, peerConnection, incomingOffer, isVideoCall = false;
    let activeCallTargetSocketId = null;

    const rtcConfig = { 
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ] 
    };

    document.getElementById('audio-call-btn').addEventListener('click', () => initiateCall(false));
    document.getElementById('video-call-btn').addEventListener('click', () => initiateCall(true));

    async function initiateCall(video) {
      if (!selectedTargetUser) {
        alert('Откройте меню слева (💬) и выберите собеседника для звонка');
        return;
      }

      isVideoCall = video;
      callOverlay.style.display = 'flex';
      callStatus.innerText = `Звоним ${selectedTargetUser}...`;
      acceptCallBtn.style.display = 'none';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
        localVideo.style.display = video ? 'block' : 'none';
        localVideo.srcObject = localStream;
        
        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        socket.emit('call-user', { targetUser: selectedTargetUser, offer, isVideo: video });
      } catch (err) { 
        alert('Не удалось получить доступ к микрофону или камере');
        endCall(); 
      }
    }

    socket.on('incoming-call', (data) => {
      incomingOffer = data.offer;
      isVideoCall = data.isVideo;
      activeCallTargetSocketId = data.fromSocketId;
      callOverlay.style.display = 'flex';
      callStatus.innerText = `Входящий вызов от ${data.from}`;
      acceptCallBtn.style.display = 'flex';
    });

    acceptCallBtn.addEventListener('click', async () => {
      acceptCallBtn.style.display = 'none';
      callStatus.innerText = 'Соединение...';
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
        localVideo.style.display = isVideoCall ? 'block' : 'none';
        localVideo.srcObject = localStream;
        
        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        
        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        
        socket.emit('make-answer', { targetSocketId: activeCallTargetSocketId, answer });
      } catch (err) { 
        endCall(); 
      }
    });

    socket.on('call-answered', async (data) => {
      activeCallTargetSocketId = data.fromSocketId;
      callStatus.innerText = 'Разговор...';
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch(e) {}
      }
    });

    socket.on('call-ended', () => endCall());
    endCallBtn.addEventListener('click', () => {
      if (activeCallTargetSocketId) socket.emit('end-call', { targetSocketId: activeCallTargetSocketId });
      endCall();
    });

    function createPeerConnection() {
      const pc = new RTCPeerConnection(rtcConfig);
      pc.onicecandidate = (e) => { 
        if (e.candidate && activeCallTargetSocketId) {
          socket.emit('ice-candidate', { targetSocketId: activeCallTargetSocketId, candidate: e.candidate });
        }
      };
      pc.ontrack = (e) => {
        if (isVideoCall) {
          remoteVideo.srcObject = e.streams[0];
        } else {
          remoteAudio.srcObject = e.streams[0];
        }
      };
      return pc;
    }

    function endCall() {
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      callOverlay.style.display = 'none';
      activeCallTargetSocketId = null;
    }
  </script>
</body>
</html>
