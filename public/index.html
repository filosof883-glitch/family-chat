<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный Чат</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #f8fafc;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
    }

    #app {
      width: 100%;
      max-width: 600px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
    }

    /* GLASS CARD COMMON */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    /* AUTH SCREEN */
    #auth-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 24px;
      text-align: center;
      z-index: 10;
    }

    .auth-title {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(to right, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 24px;
    }

    .avatar-picker {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .avatar-option {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .avatar-option.selected {
      border-color: #a855f7;
      transform: scale(1.1);
      background: rgba(168, 85, 247, 0.2);
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #a855f7;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* CHAT MAIN SCREEN */
    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    /* HEADER */
    #header {
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
      flex-shrink: 0;
    }

    .header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #chat-title {
      font-weight: 600;
      font-size: 16px;
      display: flex;
      flex-direction: column;
    }

    #chat-subtitle {
      font-size: 11px;
      color: #22c55e;
      font-weight: normal;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    /* SIDEBAR DRAWER */
    #sidebar {
      position: absolute;
      top: 0;
      left: -100%;
      width: 300px;
      height: 100%;
      background: rgba(15, 23, 42, 0.98);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 200;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 20px 16px;
    }

    #sidebar.open {
      left: 0;
    }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-section {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: rgba(255, 255, 255, 0.5);
      margin: 16px 0 8px 0;
    }

    .chat-item {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      transition: background 0.2s;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .user-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    /* MESSAGES AREA */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .system-msg {
      align-self: center;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
      margin: 8px 0;
      text-align: center;
    }

    .message {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 15px;
      word-wrap: break-word;
      position: relative;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }

    .message-user {
      font-size: 11px;
      font-weight: 600;
      opacity: 0.8;
      margin-bottom: 4px;
      color: #ec4899;
    }

    .message.own .message-user {
      color: #e0e7ff;
    }

    .message-file {
      margin-top: 8px;
    }

    .message-file img {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      display: block;
      margin-top: 4px;
    }

    .file-download-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.2);
      padding: 8px 12px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-size: 13px;
      margin-top: 4px;
    }

    /* MESSAGE ACTIONS & REACTIONS */
    .message-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .message-actions {
      display: flex;
      gap: 6px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .message:hover .message-actions {
      opacity: 1;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
      color: #fff;
      transition: background 0.2s;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .reactions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }

    .reaction-badge {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .reaction-badge.active {
      border-color: #a855f7;
      background: rgba(168, 85, 247, 0.3);
    }

    .reaction-popover {
      position: absolute;
      bottom: 100%;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 6px 10px;
      display: flex;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      z-index: 40;
    }

    .reaction-popover span {
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.15s;
    }

    .reaction-popover span:hover {
      transform: scale(1.3);
    }

    /* EMOJI PICKER */
    #emoji-picker {
      position: absolute;
      bottom: 70px;
      left: 16px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 100;
    }

    .emoji-item {
      font-size: 22px;
      cursor: pointer;
      text-align: center;
      padding: 4px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .emoji-item:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .create-room-btn {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      background: rgba(168, 85, 247, 0.2);
      border: 1px dashed rgba(168, 85, 247, 0.5);
      border-radius: 12px;
      color: #e9d5ff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
    }

    .create-room-btn:hover {
      background: rgba(168, 85, 247, 0.35);
    }

    .message-time {
      font-size: 10px;
      opacity: 0.6;
      text-align: right;
      margin-top: 4px;
    }

    #typing-indicator {
      display: none;
      padding: 0 20px 8px 20px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      font-style: italic;
    }

    /* INPUT AREA */
    #input-area {
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom)) 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }

    #message-input {
      flex: 1;
      border-radius: 24px;
      margin-bottom: 0;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 15px;
    }

    #file-input {
      display: none;
    }

    #file-btn {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      flex-shrink: 0;
    }

    #send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
    }

    /* WEBRTC CALL OVERLAY */
    #call-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      height: 100dvh;
      background: rgba(15, 23, 42, 0.98);
      z-index: 999;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 20px 30px 20px;
    }

    #call-header {
      text-align: center;
    }

    #call-status {
      font-size: 22px;
      font-weight: 600;
      margin-top: 10px;
    }

    #call-user-name {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
    }

    #call-timer {
      font-size: 13px;
      color: #a855f7;
      margin-top: 4px;
    }

    #video-container {
      position: relative;
      flex: 1;
      margin: 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      border-radius: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .audio-avatar-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .audio-avatar-circle {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: rgba(168, 85, 247, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      box-shadow: 0 0 30px rgba(168, 85, 247, 0.5);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.6); }
      70% { box-shadow: 0 0 0 25px rgba(168, 85, 247, 0); }
      100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
    }

    #remote-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #local-video {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 110px;
      height: 150px;
      object-fit: cover;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }

    .call-controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .call-action-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: none;
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s, background 0.2s;
    }

    .call-action-btn:active {
      transform: scale(0.9);
    }

    .call-action-btn.off {
      background: rgba(239, 68, 68, 0.8) !important;
    }

    #accept-call-btn { background: #22c55e; display: none; }
    #end-call-btn { background: #ef4444; }
    #toggle-mic-btn, #toggle-cam-btn { background: rgba(255, 255, 255, 0.15); }

    /* TOAST NOTIFICATION */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 1000;
      display: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div id="app">
    <div id="toast"></div>

    <!-- AUTH SCREEN -->
    <div id="auth-screen">
      <div class="glass-card">
        <h2 class="auth-title">Семейный Чат</h2>
        <p class="auth-subtitle">Выберите аватар и введите имя</p>

        <div class="avatar-picker" id="avatar-picker">
          <div class="avatar-option selected" data-avatar="👨‍👩‍👧‍👦">👨‍👩‍👧‍👦</div>
          <div class="avatar-option" data-avatar="👨">👨</div>
          <div class="avatar-option" data-avatar="👩">👩</div>
          <div class="avatar-option" data-avatar="👧">👧</div>
          <div class="avatar-option" data-avatar="👦">👦</div>
        </div>

        <form id="auth-form" onsubmit="return false;">
          <input type="text" id="username-input" placeholder="Ваше имя..." required autocomplete="off">
          <button type="button" id="login-submit-btn" class="btn">Войти в семейный чат</button>
        </form>
      </div>
    </div>

    <!-- MAIN CHAT SCREEN -->
    <div id="chat-screen">
      <div id="header">
        <div class="header-info">
          <button class="icon-btn" id="menu-btn">💬</button>
          <div id="chat-title">
            <span id="current-chat-name">Общий чат</span>
            <span id="chat-subtitle">Общение со всей семьей</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="audio-call-btn" title="Аудиозвонок">📞</button>
          <button class="icon-btn" id="video-call-btn" title="Видеозвонок">📹</button>
        </div>
      </div>

      <!-- SIDEBAR DRAWER -->
      <div id="sidebar">
        <div class="sidebar-header">
          <h3>Семейные чаты</h3>
          <button class="icon-btn" id="close-sidebar-btn">✖</button>
        </div>

        <button class="create-room-btn" id="create-room-btn">➕ Создать чат</button>

        <div class="sidebar-section">Каналы:</div>
        <div id="rooms-list">
          <div class="chat-item active" data-room="general">
            <div class="user-item-info">
              <span>💬</span>
              <span>Общий чат</span>
            </div>
          </div>
        </div>

        <div class="sidebar-section">Участники:</div>
        <div id="users-list"></div>

        <button class="btn" id="logout-btn" style="margin-top: auto; background: rgba(239, 68, 68, 0.2); color: #fca5a5;">Сменить имя</button>
      </div>

      <!-- MESSAGES AREA -->
      <div id="messages"></div>
      <div id="typing-indicator"></div>

      <!-- EMOJI PICKER POPOVER -->
      <div id="emoji-picker" style="display: none;">
        <span class="emoji-item">😀</span>
        <span class="emoji-item">😂</span>
        <span class="emoji-item">😍</span>
        <span class="emoji-item">😎</span>
        <span class="emoji-item">👍</span>
        <span class="emoji-item">❤️</span>
        <span class="emoji-item">🎉</span>
        <span class="emoji-item">🔥</span>
        <span class="emoji-item">🙌</span>
        <span class="emoji-item">🥳</span>
        <span class="emoji-item">🙏</span>
        <span class="emoji-item">💡</span>
        <span class="emoji-item">🏡</span>
        <span class="emoji-item">🛒</span>
        <span class="emoji-item">🍕</span>
        <span class="emoji-item">⭐</span>
        <span class="emoji-item">😮</span>
        <span class="emoji-item">😢</span>
      </div>

      <!-- INPUT AREA -->
      <div id="input-area">
        <button class="icon-btn" id="emoji-btn" type="button" title="Вставить эмодзи">😊</button>
        <label for="file-input" id="file-btn" title="Прикрепить файл">📎</label>
        <input type="file" id="file-input">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button class="btn" id="send-btn" type="button">➔</button>
      </div>
    </div>

    <!-- WEBRTC CALL OVERLAY -->
    <audio id="remote-audio" autoplay playsinline></audio>
    <div id="call-overlay">
      <div id="call-header">
        <div id="call-status">Звонок...</div>
        <div id="call-user-name">Соединение...</div>
        <div id="call-timer">00:00</div>
      </div>

      <div id="video-container">
        <div id="audio-avatar" class="audio-avatar-container" style="display: none;">
          <div class="audio-avatar-circle" id="call-avatar-icon">👤</div>
        </div>
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>

      <div class="call-controls">
        <button class="call-action-btn" id="toggle-mic-btn" title="Микрофон">🎙️</button>
        <button class="call-action-btn" id="accept-call-btn" title="Ответить">📞</button>
        <button class="call-action-btn" id="toggle-cam-btn" title="Камера">📷</button>
        <button class="call-action-btn" id="end-call-btn" title="Завершить">✖</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = typeof io !== 'undefined' ? io() : { on: () => {}, emit: () => {} };
    
    let currentUser = localStorage.getItem('chat_username') || '';
    let selectedAvatar = localStorage.getItem('chat_avatar') || '👨‍👩‍👧‍👦';
    let currentRoom = 'general';
    let selectedTargetUser = null; // null = Чат комнаты, иначе имя собеседника

    // WebRTC Variables
    let peerConnection = null;
    let localStream = null;
    let targetCallUser = null;
    let currentCallType = 'video'; // 'audio' or 'video'
    let isAudioMuted = false;
    let isVideoMuted = false;
    let callTimerInterval = null;
    let callSeconds = 0;
    let pendingOfferData = null;

    const rtcConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    // DOM Elements
    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const loginSubmitBtn = document.getElementById('login-submit-btn');
    const authForm = document.getElementById('auth-form');
    const avatarOptions = document.querySelectorAll('.avatar-option');
    
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const fileInput = document.getElementById('file-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');

    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPicker = document.getElementById('emoji-picker');
    const createRoomBtn = document.getElementById('create-room-btn');
    const roomsListContainer = document.getElementById('rooms-list');

    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menu-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const usersListContainer = document.getElementById('users-list');
    const currentChatName = document.getElementById('current-chat-name');
    const chatSubtitle = document.getElementById('chat-subtitle');
    const logoutBtn = document.getElementById('logout-btn');

    // Call Overlay DOM
    const callOverlay = document.getElementById('call-overlay');
    const callStatus = document.getElementById('call-status');
    const callUserName = document.getElementById('call-user-name');
    const callTimer = document.getElementById('call-timer');
    const audioAvatar = document.getElementById('audio-avatar');
    const callAvatarIcon = document.getElementById('call-avatar-icon');
    const remoteVideo = document.getElementById('remote-video');
    const localVideo = document.getElementById('local-video');
    const remoteAudio = document.getElementById('remote-audio');
    
    const audioCallBtn = document.getElementById('audio-call-btn');
    const videoCallBtn = document.getElementById('video-call-btn');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const toggleMicBtn = document.getElementById('toggle-mic-btn');
    const toggleCamBtn = document.getElementById('toggle-cam-btn');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }

    // Выбор аватара
    avatarOptions.forEach(option => {
      option.addEventListener('click', () => {
        avatarOptions.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        selectedAvatar = option.dataset.avatar;
      });
    });

    // Функция входа
    function handleLogin() {
      const name = usernameInput.value.trim();
      if (!name) return;

      currentUser = name;
      localStorage.setItem('chat_username', currentUser);
      localStorage.setItem('chat_avatar', selectedAvatar);

      socket.emit('user-joined', { name: currentUser, avatar: selectedAvatar });

      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';

      selectRoom('general', 'Общий чат');
    }

    // События входа
    loginSubmitBtn.addEventListener('click', handleLogin);
    authForm.addEventListener('submit', (e) => {
      e.preventDefault();
      handleLogin();
    });

    // Автоматический вход при сохраненном имени
    if (currentUser) {
      usernameInput.value = currentUser;
      avatarOptions.forEach(opt => {
        if (opt.dataset.avatar === selectedAvatar) {
          opt.classList.add('selected');
        } else {
          opt.classList.remove('selected');
        }
      });
      handleLogin();
    }

    // Выход из аккаунта
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('chat_username');
      location.reload();
    });

    // Управление боковым меню
    menuBtn.addEventListener('click', () => { sidebar.classList.add('open'); });
    closeSidebarBtn.addEventListener('click', () => { sidebar.classList.remove('open'); });

    // Переключение в личный чат с пользователем
    function selectUserChat(username, avatar) {
      selectedTargetUser = username;
      currentRoom = null;
      currentChatName.innerText = `${avatar || '👤'} ${username}`;
      chatSubtitle.innerText = 'Личные сообщения';

      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      sidebar.classList.remove('open');
      messagesDiv.innerHTML = '';
      socket.emit('get-history', { room: null, targetUser: selectedTargetUser, user: currentUser });
    }

    // Обновление списка участников
    socket.on('users-list', (users) => {
      usersListContainer.innerHTML = '';
      users.forEach(u => {
        if (u.name === currentUser) return;
        const item = document.createElement('div');
        item.className = `chat-item ${selectedTargetUser === u.name ? 'active' : ''}`;
        item.innerHTML = `
          <div class="user-item-info">
            <span>${u.avatar || '👤'}</span>
            <span>${escapeHtml(u.name)}</span>
          </div>
          <div class="status-dot"></div>
        `;
        item.addEventListener('click', () => {
          selectUserChat(u.name, u.avatar);
        });
        usersListContainer.appendChild(item);
      });
    });

    // Отправка сообщений по кнопке и Enter
    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    // Индикатор набора текста
    let typingTimeout = null;
    messageInput.addEventListener('input', () => {
      socket.emit('typing', { user: currentUser, room: currentRoom, targetUser: selectedTargetUser });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => {
        socket.emit('stop-typing', { user: currentUser, room: currentRoom, targetUser: selectedTargetUser });
      }, 1500);
    });

    socket.on('user-typing', (data) => {
      if (data.user !== currentUser) {
        typingIndicator.innerText = `${data.user} печатает...`;
        typingIndicator.style.display = 'block';
      }
    });

    socket.on('user-stop-typing', () => {
      typingIndicator.style.display = 'none';
    });

    // Прием новых сообщений и истории
    socket.on('chat message', (msg) => {
      if (selectedTargetUser) {
        if ((msg.user === currentUser && msg.targetUser === selectedTargetUser) ||
            (msg.user === selectedTargetUser && msg.targetUser === currentUser)) {
          appendMessage(msg);
        }
      } else if (msg.room === currentRoom && !msg.targetUser) {
        appendMessage(msg);
      }
    });

    socket.on('chat-history', (history) => {
      messagesDiv.innerHTML = '';
      if (Array.isArray(history)) {
        history.forEach(msg => appendMessage(msg));
      }
    });

    // Вспомогательные функции
    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    // Toggle Emoji Picker
    emojiBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      emojiPicker.style.display = emojiPicker.style.display === 'none' ? 'grid' : 'none';
    });

    document.addEventListener('click', (e) => {
      if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
        emojiPicker.style.display = 'none';
      }
    });

    document.querySelectorAll('.emoji-item').forEach(item => {
      item.addEventListener('click', () => {
        messageInput.value += item.innerText;
        messageInput.focus();
      });
    });

    // Create Room Logic
    createRoomBtn.addEventListener('click', () => {
      const roomName = prompt('Введите название нового семейного чата:');
      if (roomName && roomName.trim()) {
        socket.emit('create-room', { name: roomName.trim() });
      }
    });

    socket.on('rooms-list', (rooms) => {
      roomsListContainer.innerHTML = '';
      if (Array.isArray(rooms)) {
        rooms.forEach(room => {
          const item = document.createElement('div');
          item.className = `chat-item ${currentRoom === room.id && !selectedTargetUser ? 'active' : ''}`;
          item.dataset.room = room.id;
          item.innerHTML = `
            <div class="user-item-info">
              <span>${room.icon || '💬'}</span>
              <span>${escapeHtml(room.name)}</span>
            </div>
          `;
          item.addEventListener('click', () => {
            selectRoom(room.id, room.name);
          });
          roomsListContainer.appendChild(item);
        });
      }
    });

    function selectRoom(roomId, roomName) {
      currentRoom = roomId;
      selectedTargetUser = null;
      currentChatName.innerText = roomName;
      chatSubtitle.innerText = 'Семейный канал';
      
      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.querySelector(`[data-room="${roomId}"]`);
      if (activeEl) activeEl.classList.add('active');
      
      sidebar.classList.remove('open');
      messagesDiv.innerHTML = '';
      socket.emit('get-history', { room: currentRoom });
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      const file = fileInput.files[0];

      if (!text && !file) return;

      let fileData = null;
      if (file) {
        fileData = {
          name: file.name,
          type: file.type,
          size: file.size,
          data: await readFileAsBase64(file)
        };
      }

      const newMsg = {
        id: Date.now().toString() + Math.random().toString(36).substring(2, 5),
        user: currentUser,
        text: text,
        file: fileData,
        targetUser: selectedTargetUser,
        room: currentRoom,
        reactions: {},
        timestamp: Date.now()
      };

      socket.emit('chat message', newMsg);

      messageInput.value = '';
      fileInput.value = '';
      emojiPicker.style.display = 'none';
    }

    socket.on('message-deleted', (data) => {
      const msgEl = document.getElementById(`msg-${data.messageId}`);
      if (msgEl) msgEl.remove();
    });

    socket.on('message-reacted', (data) => {
      const msgEl = document.getElementById(`msg-${data.messageId}`);
      if (msgEl) {
        updateReactionsUI(msgEl, data.reactions, data.messageId);
      }
    });

    function appendMessage(msg) {
      if (msg.isSystem) {
        const sysEl = document.createElement('div');
        sysEl.className = 'system-msg';
        sysEl.innerText = msg.text;
        messagesDiv.appendChild(sysEl);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return;
      }

      const isOwn = msg.user === currentUser;
      const msgEl = document.createElement('div');
      msgEl.className = `message ${isOwn ? 'own' : 'other'}`;
      msgEl.id = `msg-${msg.id}`;

      const time = new Date(msg.timestamp || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let fileHTML = '';
      if (msg.file) {
        if (msg.file.type && msg.file.type.startsWith('image/')) {
          fileHTML = `<div class="message-file"><img src="${msg.file.data}" alt="attachment"></div>`;
        } else {
          fileHTML = `<div class="message-file"><a class="file-download-btn" href="${msg.file.data}" download="${escapeHtml(msg.file.name)}">💾 ${escapeHtml(msg.file.name)}</a></div>`;
        }
      }

      const actionsHTML = `
        <div class="message-actions">
          <button class="action-btn react-btn" title="Добавить реакцию">❤️</button>
          ${isOwn ? `<button class="action-btn delete-btn" title="Удалить">🗑️</button>` : ''}
        </div>
      `;

      msgEl.innerHTML = `
        <div class="message-header-row">
          <div class="message-user">${escapeHtml(msg.user)}</div>
          ${actionsHTML}
        </div>
        <div>${escapeHtml(msg.text)}</div>
        ${fileHTML}
        <div class="reactions-bar"></div>
        <div class="message-time">${time}</div>
      `;

      // Event Listeners for Reactions & Deletion
      const reactBtn = msgEl.querySelector('.react-btn');
      reactBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        showReactionPopover(msgEl, msg.id, e.target);
      });

      if (isOwn) {
        const deleteBtn = msgEl.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => {
          socket.emit('delete-message', { messageId: msg.id, room: currentRoom, targetUser: selectedTargetUser });
        });
      }

      updateReactionsUI(msgEl, msg.reactions || {}, msg.id);

      messagesDiv.appendChild(msgEl);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showReactionPopover(msgEl, messageId, targetBtn) {
      let popover = msgEl.querySelector('.reaction-popover');
      if (popover) {
        popover.remove();
        return;
      }

      popover = document.createElement('div');
      popover.className = 'reaction-popover';
      const emojis = ['👍', '❤️', '😂', '😮', '😢', '🙏'];
      
      emojis.forEach(emoji => {
        const span = document.createElement('span');
        span.innerText = emoji;
        span.addEventListener('click', () => {
          socket.emit('react-message', { messageId, emoji, user: currentUser, room: currentRoom, targetUser: selectedTargetUser });
          popover.remove();
        });
        popover.appendChild(span);
      });

      msgEl.appendChild(popover);
    }

    function updateReactionsUI(msgEl, reactions, messageId) {
      const reactionsBar = msgEl.querySelector('.reactions-bar');
      if (!reactionsBar) return;
      reactionsBar.innerHTML = '';

      const counts = {};
      Object.entries(reactions).forEach(([user, emoji]) => {
        if (!counts[emoji]) counts[emoji] = { count: 0, users: [] };
        counts[emoji].count++;
        counts[emoji].users.push(user);
      });

      Object.entries(counts).forEach(([emoji, data]) => {
        const badge = document.createElement('div');
        const hasReacted = data.users.includes(currentUser);
        badge.className = `reaction-badge ${hasReacted ? 'active' : ''}`;
        badge.innerHTML = `<span>${emoji}</span> <span>${data.count}</span>`;
        badge.title = data.users.join(', ');
        badge.addEventListener('click', () => {
          socket.emit('react-message', { messageId, emoji, user: currentUser, room: currentRoom, targetUser: selectedTargetUser });
        });
        reactionsBar.appendChild(badge);
      });
    }

    // WEBRTC CALLING LOGIC
    audioCallBtn.addEventListener('click', () => startCall('audio'));
    videoCallBtn.addEventListener('click', () => startCall('video'));

    async function startCall(type) {
      if (!selectedTargetUser) {
        showToast('Выберите конкретного участника для звонка');
        return;
      }

      currentCallType = type;
      targetCallUser = selectedTargetUser;

      callStatus.innerText = type === 'audio' ? 'Аудиозвонок...' : 'Видеозвонок...';
      callUserName.innerText = selectedTargetUser;
      callOverlay.style.display = 'flex';
      acceptCallBtn.style.display = 'none';

      setupCallUI(type);

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: type === 'video'
        });

        if (type === 'video') {
          localVideo.srcObject = localStream;
        }

        createPeerConnection();

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        socket.emit('call-user', {
          targetUser: targetCallUser,
          callerName: currentUser,
          callerAvatar: selectedAvatar,
          callType: type,
          offer: offer
        });

      } catch (err) {
        console.error('Call media error:', err);
        showToast('Не удалось получить доступ к микрофону/камере');
        endCall(false);
      }
    }

    function setupCallUI(type) {
      if (type === 'audio') {
        remoteVideo.style.display = 'none';
        localVideo.style.display = 'none';
        audioAvatar.style.display = 'flex';
        toggleCamBtn.style.display = 'none';
        callAvatarIcon.innerText = selectedAvatar || '👤';
      } else {
        remoteVideo.style.display = 'block';
        localVideo.style.display = 'block';
        audioAvatar.style.display = 'none';
        toggleCamBtn.style.display = 'flex';
      }
    }

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);

      peerConnection.onicecandidate = (event) => {
        if (event.candidate && targetCallUser) {
          socket.emit('ice-candidate', {
            targetUser: targetCallUser,
            candidate: event.candidate
          });
        }
      };

      peerConnection.ontrack = (event) => {
        if (currentCallType === 'video') {
          remoteVideo.srcObject = event.streams[0];
        } else {
          remoteAudio.srcObject = event.streams[0];
        }
      };
    }

    // Входящий звонок
    socket.on('incoming-call', (data) => {
      targetCallUser = data.callerName;
      currentCallType = data.callType;
      pendingOfferData = data.offer;

      callStatus.innerText = data.callType === 'audio' ? 'Входящий аудиозвонок' : 'Входящий видеозвонок';
      callUserName.innerText = `${data.callerAvatar || '👤'} ${data.callerName}`;
      callOverlay.style.display = 'flex';

      acceptCallBtn.style.display = 'flex';
      setupCallUI(data.callType);
    });

    acceptCallBtn.addEventListener('click', acceptCall);

    async function acceptCall() {
      acceptCallBtn.style.display = 'none';
      callStatus.innerText = 'Соединение...';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: true,
          video: currentCallType === 'video'
        });

        if (currentCallType === 'video') {
          localVideo.srcObject = localStream;
        }

        createPeerConnection();

        localStream.getTracks().forEach(track => {
          peerConnection.addTrack(track, localStream);
        });

        await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOfferData));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        socket.emit('accept-call', {
          targetUser: targetCallUser,
          answer: answer
        });

        startCallTimer();
        callStatus.innerText = 'Разговор';

      } catch (err) {
        console.error('Accept call error:', err);
        showToast('Ошибка подключения звонка');
        endCall(true);
      }
    }

    socket.on('call-accepted', async (data) => {
      callStatus.innerText = 'Разговор';
      startCallTimer();
      if (peerConnection) {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
      }
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection && data.candidate) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error('ICE Candidate error:', e);
        }
      }
    });

    // Управление микрофоном и камерой
    toggleMicBtn.addEventListener('click', () => {
      if (localStream) {
        const audioTrack = localStream.getAudioTracks()[0];
        if (audioTrack) {
          isAudioMuted = !isAudioMuted;
          audioTrack.enabled = !isAudioMuted;
          toggleMicBtn.classList.toggle('off', isAudioMuted);
          toggleMicBtn.innerText = isAudioMuted ? '🔇' : '🎙️';
        }
      }
    });

    toggleCamBtn.addEventListener('click', () => {
      if (localStream && currentCallType === 'video') {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
          isVideoMuted = !isVideoMuted;
          videoTrack.enabled = !isVideoMuted;
          toggleCamBtn.classList.toggle('off', isVideoMuted);
          toggleCamBtn.innerText = isVideoMuted ? '🚫' : '📷';
        }
      }
    });

    // Завершение звонка
    endCallBtn.addEventListener('click', () => endCall(true));

    socket.on('call-ended', () => {
      endCall(false);
      showToast('Звонок завершен');
    });

    function endCall(notifyPeer = true) {
      if (notifyPeer && targetCallUser) {
        socket.emit('end-call', { targetUser: targetCallUser });
      }

      if (peerConnection) {
        peerConnection.close();
        peerConnection = null;
      }

      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }

      remoteVideo.srcObject = null;
      localVideo.srcObject = null;
      remoteAudio.srcObject = null;

      callOverlay.style.display = 'none';
      stopCallTimer();

      targetCallUser = null;
      isAudioMuted = false;
      isVideoMuted = false;
      toggleMicBtn.classList.remove('off');
      toggleCamBtn.classList.remove('off');
      toggleMicBtn.innerText = '🎙️';
      toggleCamBtn.innerText = '📷';
    }

    function startCallTimer() {
      callSeconds = 0;
      callTimer.innerText = '00:00';
      clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const mins = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const secs = String(callSeconds % 60).padStart(2, '0');
        callTimer.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function stopCallTimer() {
      clearInterval(callTimerInterval);
      callTimer.innerText = '00:00';
    }
  </script>
