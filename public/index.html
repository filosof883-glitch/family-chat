<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Семейный Чат</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      width: 100%;
      overflow: hidden;
      background: #0f172a;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #app {
      width: 100%;
      max-width: 500px;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    #auth-screen {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 24px;
      text-align: center;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    h2 {
      font-size: 24px;
      margin-bottom: 24px;
      font-weight: 600;
      background: linear-gradient(to right, #a855f7, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #chat-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      position: relative;
    }

    #header {
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.85);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      flex-shrink: 0;
    }

    #chat-title {
      font-weight: 600;
      font-size: 16px;
      display: flex;
      flex-direction: column;
    }

    #chat-subtitle {
      font-size: 11px;
      opacity: 0.6;
      font-weight: normal;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      cursor: pointer;
    }

    #sidebar {
      position: absolute;
      top: 0; left: -100%;
      width: 280px;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 200;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    #sidebar.open { left: 0; }

    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sidebar-section {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.5);
      margin: 12px 0 6px 0;
    }

    .chat-item {
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(168, 85, 247, 0.25);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-dot.online { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .status-dot.offline { background: #64748b; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      position: relative;
    }

    .message.own {
      align-self: flex-end;
      background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.other {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .message-user { font-size: 11px; opacity: 0.7; }

    .delete-btn {
      background: none; border: none;
      color: rgba(255, 255, 255, 0.6);
      cursor: pointer; font-size: 13px;
      padding-left: 8px;
    }

    .message-time { font-size: 10px; opacity: 0.6; text-align: right; margin-top: 4px; }
    .message-img { width: 100%; max-width: 260px; border-radius: 12px; margin-top: 4px; }

    #input-area {
      flex-shrink: 0;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(25px);
      border-top: 1px solid rgba(255, 255, 255, 0.15);
    }

    #message-input {
      flex: 1; border-radius: 20px; margin-bottom: 0; padding: 12px 16px;
      background: rgba(255, 255, 255, 0.08);
    }

    #send-btn, #photo-btn {
      width: 44px; height: 44px; border-radius: 50%; padding: 0;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }

    #file-input { display: none; }

    #group-modal {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      z-index: 300;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 16px;
      text-align: left;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    #call-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: 100dvh;
      background: rgba(15, 23, 42, 0.98); z-index: 999; display: none;
      flex-direction: column; justify-content: space-between;
      padding: 40px 20px calc(30px + env(safe-area-inset-bottom)) 20px;
    }

    #call-status { text-align: center; font-size: 20px; margin-top: 20px; }
    #video-container { position: relative; flex: 1; margin: 20px 0; display: flex; justify-content: center; align-items: center; }
    #remote-video { width: 100%; height: 100%; object-fit: cover; border-radius: 20px; }
    #local-video { position: absolute; top: 10px; right: 10px; width: 100px; height: 140px; object-fit: cover; border-radius: 12px; border: 2px solid rgba(255,255,255,0.3); }
    .call-controls { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
    .call-action-btn { width: 64px; height: 64px; border-radius: 50%; border: none; color: white; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    #accept-call-btn { background: #22c55e; }
    #end-call-btn { background: #ef4444; }
  </style>
</head>
<body>

  <div id="app">
    <div id="auth-screen">
      <div class="glass-card">
        <h2>Семейный Чат</h2>
        <form id="auth-form" onsubmit="return false;">
          <input type="text" id="username-input" placeholder="Введите ваше имя..." required autocomplete="off">
          <button type="button" id="login-submit-btn" class="btn">Войти в чат</button>
        </form>
      </div>
    </div>

    <div id="chat-screen">
      <div id="header">
        <button class="icon-btn" id="menu-btn" title="Чаты">💬</button>
        <div id="chat-title">
          <span id="current-chat-name">Общий чат</span>
          <span id="chat-subtitle">Чат для всех</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="audio-call-btn" title="Аудиовызов">📞</button>
          <button class="icon-btn" id="video-call-btn" title="Видеовызов">📹</button>
        </div>
      </div>

      <div id="sidebar">
        <div class="sidebar-header">
          <h3>Чаты</h3>
          <button class="icon-btn" id="close-sidebar-btn">✖</button>
        </div>

        <div class="chat-item active" id="general-chat-btn">
          <span>💬 Общий чат</span>
        </div>

        <button class="btn" id="open-group-modal-btn" style="padding: 8px; margin: 8px 0; font-size: 13px;">+ Создать группу</button>

        <div class="sidebar-section">Группы</div>
        <div id="groups-list"></div>

        <div class="sidebar-section">Личные сообщения</div>
        <div id="users-list"></div>

        <button class="btn" id="logout-btn" style="margin-top: auto; background: rgba(239, 68, 68, 0.2); color: #fca5a5;">Выйти</button>
      </div>

      <div id="messages"></div>

      <div id="input-area">
        <button class="icon-btn" id="photo-btn" type="button">📷</button>
        <input type="file" id="file-input" accept="image/*">
        <input type="text" id="message-input" placeholder="Сообщение..." autocomplete="off">
        <button class="btn" id="send-btn" type="button">➔</button>
      </div>
    </div>

    <div id="group-modal">
      <div class="glass-card">
        <h3 style="margin-bottom: 16px;">Новая группа</h3>
        <input type="text" id="group-name-input" placeholder="Название группы..." style="margin-bottom: 12px;">
        <div class="sidebar-section" style="text-align: left;">Выберите участников:</div>
        <div class="checkbox-group" id="group-members-select"></div>
        <div style="display: flex; gap: 8px;">
          <button class="btn" id="create-group-btn">Создать</button>
          <button class="btn" id="cancel-group-btn" style="background: rgba(255,255,255,0.1);">Отмена</button>
        </div>
      </div>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>
    <div id="call-overlay">
      <h3 id="call-status">Входящий вызов...</h3>
      <div id="video-container">
        <video id="remote-video" autoplay playsinline></video>
        <video id="local-video" autoplay playsinline muted></video>
      </div>
      <div class="call-controls">
        <button class="call-action-btn" id="accept-call-btn">📞</button>
        <button class="call-action-btn" id="end-call-btn">✖</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentUser = localStorage.getItem('chat_username') || '';
    let currentRoomId = 'general';
    let allUsers = [];

    const authScreen = document.getElementById('auth-screen');
    const chatScreen = document.getElementById('chat-screen');
    const usernameInput = document.getElementById('username-input');
    const loginSubmitBtn = document.getElementById('login-submit-btn');
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('message-input');
    const sendBtn = document.getElementById('send-btn');
    const photoBtn = document.getElementById('photo-btn');
    const fileInput = document.getElementById('file-input');

    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menu-btn');
    const closeSidebarBtn = document.getElementById('close-sidebar-btn');
    const generalChatBtn = document.getElementById('general-chat-btn');
    const usersListContainer = document.getElementById('users-list');
    const groupsListContainer = document.getElementById('groups-list');
    const currentChatName = document.getElementById('current-chat-name');
    const chatSubtitle = document.getElementById('chat-subtitle');

    const groupModal = document.getElementById('group-modal');
    const openGroupModalBtn = document.getElementById('open-group-modal-btn');
    const cancelGroupBtn = document.getElementById('cancel-group-btn');
    const createGroupBtn = document.getElementById('create-group-btn');
    const groupNameInput = document.getElementById('group-name-input');
    const groupMembersSelect = document.getElementById('group-members-select');

    function performLogin() {
      const val = usernameInput.value.trim();
      if (val) {
        currentUser = val;
        localStorage.setItem('chat_username', currentUser);
        showChat();
      }
    }

    loginSubmitBtn.addEventListener('click', performLogin);
    usernameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') performLogin();
    });

    if (currentUser) {
      showChat();
    }

    function showChat() {
      authScreen.style.display = 'none';
      chatScreen.style.display = 'flex';
      socket.emit('register user', currentUser);
      switchRoom('general', 'Общий чат', 'Чат для всех');
    }

    menuBtn.addEventListener('click', () => sidebar.classList.add('open'));
    closeSidebarBtn.addEventListener('click', () => sidebar.classList.remove('open'));

    function switchRoom(roomId, roomTitle, subtitle = '') {
      currentRoomId = roomId;
      currentChatName.innerText = roomTitle;
      chatSubtitle.innerText = subtitle;
      messagesDiv.innerHTML = '';
      sidebar.classList.remove('open');

      document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
      socket.emit('join room', roomId);
    }

    generalChatBtn.addEventListener('click', () => {
      generalChatBtn.classList.add('active');
      switchRoom('general', 'Общий чат', 'Чат для всех');
    });

    socket.on('users list', (users) => {
      allUsers = users;
      usersListContainer.innerHTML = '';
      users.forEach(u => {
        if (u.username === currentUser) return;

        const item = document.createElement('div');
        item.className = 'chat-item';
        const dmRoomId = 'dm_' + [currentUser, u.username].sort().join('_');
        
        item.innerHTML = `
          <span>👤 ${escapeHtml(u.username)}</span>
          <span class="status-dot ${u.online ? 'online' : 'offline'}"></span>
        `;
        item.addEventListener('click', () => {
          switchRoom(dmRoomId, u.username, u.online ? 'В сети' : 'Не в сети');
          item.classList.add('active');
        });
        usersListContainer.appendChild(item);
      });
    });

    socket.on('user rooms', (rooms) => {
      groupsListContainer.innerHTML = '';
      if (Array.isArray(rooms)) {
        rooms.forEach(r => {
          const item = document.createElement('div');
          item.className = 'chat-item';
          item.innerHTML = `<span>👥 ${escapeHtml(r.name)}</span>`;
          item.addEventListener('click', () => {
            switchRoom(r.id, r.name, `${r.members ? r.members.length : 0} участн.`);
            item.classList.add('active');
          });
          groupsListContainer.appendChild(item);
        });
      }
    });

    openGroupModalBtn.addEventListener('click', () => {
      groupMembersSelect.innerHTML = '';
      allUsers.forEach(u => {
        if (u.username === currentUser) return;
        const label = document.createElement('label');
        label.className = 'checkbox-item';
        label.innerHTML = `<input type="checkbox" value="${u.username}"> ${u.username}`;
        groupMembersSelect.appendChild(label);
      });
      groupModal.style.display = 'flex';
    });

    cancelGroupBtn.addEventListener('click', () => groupModal.style.display = 'none');

    createGroupBtn.addEventListener('click', () => {
      const gName = groupNameInput.value.trim();
      const selected = Array.from(groupMembersSelect.querySelectorAll('input:checked')).map(cb => cb.value);

      if (gName && selected.length > 0) {
        socket.emit('create group', { groupName: gName, members: selected });
        groupNameInput.value = '';
        groupModal.style.display = 'none';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      localStorage.removeItem('chat_username');
      location.reload();
    });

    sendBtn.addEventListener('click', sendMessage);
    messageInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    function sendMessage() {
      const text = messageInput.value.trim();
      if (text) {
        socket.emit('chat message', {
          roomId: currentRoomId,
          user: currentUser,
          text: text,
          type: 'text'
        });
        messageInput.value = '';
      }
    }

    photoBtn.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width, height = img.height;
        const maxSize = 800;
        if (width > height && width > maxSize) { height *= maxSize / width; width = maxSize; }
        else if (height > maxSize) { width *= maxSize / height; height = maxSize; }

        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        socket.emit('chat message', {
          roomId: currentRoomId,
          user: currentUser,
          image: canvas.toDataURL('image/jpeg', 0.6),
          type: 'image'
        });
        fileInput.value = '';
      };
    });

    socket.on('chat history', ({ roomId, messages }) => {
      if (roomId === currentRoomId) {
        messagesDiv.innerHTML = '';
        if (Array.isArray(messages)) {
          messages.forEach(appendMessage);
        }
        scrollToBottom();
      }
    });

    socket.on('chat message', (msg) => {
      if (msg.roomId === currentRoomId) {
        appendMessage(msg);
        scrollToBottom();
      }
    });

    window.deleteMessage = function(id) {
      if (confirm('Удалить сообщение?')) {
        socket.emit('delete message', { roomId: currentRoomId, messageId: id });
      }
    };

    socket.on('delete message', ({ roomId, messageId }) => {
      if (roomId === currentRoomId) {
        const el = document.querySelector(`.message[data-id="${messageId}"]`);
        if (el) el.remove();
      }
    });

    function appendMessage(msg) {
      const isOwn = msg.user === currentUser;
      const msgEl = document.createElement('div');
      msgEl.classList.add('message', isOwn ? 'own' : 'other');
      if (msg.id) msgEl.setAttribute('data-id', msg.id);

      const time = (msg.timestamp ? new Date(msg.timestamp) : new Date()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const delBtn = (isOwn && msg.id) ? `<button class="delete-btn" onclick="deleteMessage('${msg.id}')">🗑️</button>` : '';

      let content = `<div class="message-header"><span class="message-user">${msg.user}</span>${delBtn}</div>`;
      content += msg.type === 'image' ? `<img src="${msg.image}" class="message-img" onload="scrollToBottom()" />` : `<div>${escapeHtml(msg.text)}</div>`;
      content += `<div class="message-time">${time}</div>`;

      msgEl.innerHTML = content;
      messagesDiv.appendChild(msgEl);
    }

    function scrollToBottom() { messagesDiv.scrollTop = messagesDiv.scrollHeight; }
    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    const callOverlay = document.getElementById('call-overlay');
    const callStatus = document.getElementById('call-status');
    const acceptCallBtn = document.getElementById('accept-call-btn');
    const endCallBtn = document.getElementById('end-call-btn');
    const localVideo = document.getElementById('local-video');
    const remoteVideo = document.getElementById('remote-video');
    const remoteAudio = document.getElementById('remote-audio');

    let localStream, peerConnection, incomingOffer, isVideoCall = false;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.relay.metered.ca:80' }] };

    document.getElementById('audio-call-btn').addEventListener('click', () => startCall(false));
    document.getElementById('video-call-btn').addEventListener('click', () => startCall(true));

    async function startCall(video) {
      isVideoCall = video;
      callOverlay.style.display = 'flex';
      callStatus.innerText = 'Звоним...';
      acceptCallBtn.style.display = 'none';

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: video });
        if (video) localVideo.srcObject = localStream;
        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        socket.emit('call-user', { offer, isVideo: video, from: currentUser });
      } catch (err) { endCall(); }
    }

    socket.on('incoming-call', (data) => {
      incomingOffer = data.offer;
      isVideoCall = data.isVideo;
      callOverlay.style.display = 'flex';
      callStatus.innerText = `Входящий вызов от ${data.from}`;
      acceptCallBtn.style.display = 'flex';
    });

    acceptCallBtn.addEventListener('click', async () => {
      acceptCallBtn.style.display = 'none';
      callStatus.innerText = 'Соединение...';
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall });
        if (isVideoCall) localVideo.srcObject = localStream;
        peerConnection = createPeerConnection();
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOffer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('make-answer', { answer });
      } catch (err) { endCall(); }
    });

    socket.on('call-answered', async (data) => {
      callStatus.innerText = 'Разговор...';
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on('ice-candidate', async (data) => {
      if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
    });

    socket.on('call-ended', () => endCall(false));
    endCallBtn.addEventListener('click', () => { socket.emit('end-call'); endCall(true); });

    function createPeerConnection() {
      const pc = new RTCPeerConnection(rtcConfig);
      pc.onicecandidate = (e) => { if (e.candidate) socket.emit('ice-candidate', { candidate: e.candidate }); };
      pc.ontrack = (e) => {
        if (isVideoCall) remoteVideo.srcObject = e.streams[0];
        else remoteAudio.srcObject = e.streams[0];
      };
      return pc;
    }

    function endCall() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      callOverlay.style.display = 'none';
      localVideo.srcObject = null; remoteVideo.srcObject = null; remoteAudio.srcObject = null;
    }
  </script>
</body>
</html>
